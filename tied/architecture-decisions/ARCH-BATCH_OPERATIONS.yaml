ARCH-BATCH_OPERATIONS:
  alternatives_considered:
    - cons:
        - Slower for large file sets
      name: Sequential operations
      pros:
        - Simpler implementation
      rejected_reason: Parallel operations significantly faster
    - cons:
        - Complex job management infrastructure
      name: Server-side job queue
      pros:
        - Survives page refresh
      rejected_reason: Over-engineered for current needs
  cross_references:
    - REQ-BULK_FILE_OPS
  decision: '[See architecture-decisions.yaml for details]'
  implementation_approach:
    details:
      - Check marks.size > 0, use marked files; else use cursor file
      - Conflict detection compares resolved dest paths not basenames when tree spans subdirectories
      - 'Error collection: continue on error, report at end'
      - POST /api/files operation bulk-rename with entries { src, dest }[]; client rename-regex.ts resolves paths then bulkRename Promise.allSettled
      - 'POST /api/files with operation: bulk-copy/bulk-move/bulk-delete'
      - 'Progress dialog shows: percentage, file count, current file'
      - 'Relative destination mapping: bulk-copy/move and sync-all accept sourceBase; resolveCrossPaneDestPath preserves path under dest base (REQ-DIRECTORY_TREE)'
      - Server streams progress updates via callbacks
    summary: Promise.all with progress callbacks, fallback to cursor file
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-05-31T00:00:00.000Z'
      reason: LEAP — bulk-rename via IMPL-RENAME_REGEX traceability
    last_validated:
      date: {}
      result: pass
      validator: AI Agent
  name: Async Batch File Operations Architecture
  rationale:
    benefits:
      - Cross-pane operation support
      - Graceful error handling with partial success
      - Non-blocking UI with Promise.all
      - Real-time progress callbacks
    problems_solved:
      - Blocking UI during long operations
      - No progress visibility
      - Poor error recovery
    why: Batch operations need async execution with progress tracking and error handling
  related_decisions:
    depends_on:
      - ARCH-MARKING_STATE
    informs:
      - IMPL-BULK_OPS
    see_also:
      - ARCH-SERVER_CLIENT_BOUNDARY
  status: Active
  traceability:
    code_annotations:
      - ARCH-BATCH_OPERATIONS
    implementation:
      - IMPL-BULK_OPS
      - IMPL-RENAME_REGEX
    requirements:
      - REQ-BULK_FILE_OPS
    tests:
      - src/app/api/files/route.test.ts
      - src/app/files/WorkspaceView.rename-regex.test.tsx
      - src/lib/rename-regex.data.test.ts
      - src/lib/rename-regex.test.ts
