ARCH-MOUSE_SUPPORT:
  alternatives_considered:
    - cons:
        - Dependency, configuration overhead
      name: Custom context menu library
      pros:
        - Advanced features (submenus, icons)
      rejected_reason: Simple portal component meets requirements
    - cons:
        - Extra dependency, bundle size
      name: Third-party drag-drop library
      pros:
        - Polished DX, handles edge cases
      rejected_reason: HTML5 API sufficient
  cross_references:
    - REQ-MOUSE_INTERACTION
  decision: |-
    Approach

    1. Context Menu: Portal-rendered menu component positioned at click coordinates
    2. Click Selection: Existing `onClick` handlers in FilePane (already implemented)
    3. Double-Click: Existing `onDoubleClick` handlers in FilePane (already implemented)
    4. Drag-and-Drop: HTML5 drag-and-drop API with custom drag image
    5. Scroll: Native browser scrolling (no custom implementation needed)

    Key Components

    ContextMenu Component

    ```typescript
    interface ContextMenuProps {
      x: number; // Click coordinates
      y: number;
      file: FileStat;
      marks: Set<string>;
      onClose: () => void;
      onCopy: () => void;
      onMove: () => void;
      onDelete: () => void;
      onRename: () => void;
    }
    ```

    • Portal-rendered to document.body to escape parent overflow
    • Position calculated to keep menu on-screen
    • Close on outside click or Escape key
    • Keyboard navigation within menu (arrow keys, Enter)

    Drag-and-Drop Implementation

    ```typescript
    // Source pane (draggable files)
    <div 
      draggable={true}
      onDragStart={handleDragStart}
      onDragEnd={handleDragEnd}
    >

    // Target pane (drop zone)
    <div
      onDragOver={handleDragOver}
      onDrop={handleDrop}
      onDragEnter={handleDragEnter}
      onDragLeave={handleDragLeave}
    >
    ```

    • Store drag data in `dataTransfer` object
    • Use custom drag image with file count badge
    • Highlight drop target on drag hover
    • Detect Ctrl key for copy vs move
  implementation_approach:
    details:
      - 'Click: Existing onClick handlers (already implemented)'
      - 'Column menu mutual exclusion: stopPropagation on column cells; clearing sibling menu state when opening the other menu'
      - 'ContextMenu: Portal to document.body for row file operations (copy, move, delete, rename)'
      - 'Cross-pane clipboard: workspace paneFilesList resolves paths by cursor filename (basename), not full-path equality'
      - 'Double-click: Existing onDoubleClick handlers (already implemented)'
      - 'Drag-drop: HTML5 API with custom drag image and modifier key detection'
      - 'FileColumnContextMenu: Portal clipboard menu on metadata column cells (name, size, mtime); copy filename, absolute path, cross-pane paths'
      - 'Pane command execution: ExecuteFileDialog secondary dialog with pane target and command field (ARCH-PANE_COMMAND_EXEC)'
      - 'Scroll: Native browser overflow-y-auto'
      - 'Set as Base directory: directory rows open secondary dialog with nine pane-target actions and SetBaseDirectoryTargetIcon semantic SVG (IMPL-WORKSPACE_VIEW SetBaseDirectoryDialog)'
      - 'Touch mtime: TouchFileDialog secondary dialog with pane target and mtime mode groups (ARCH-TOUCH_MTIME)'
      - 'Unified file context menu: row and column right-click use one ContextMenu portal with file ops, clipboard section, and set-base on directories (UNIFIED_ROW_CONTEXT_MENU)'
    summary: Portal-based context menus (row operations and file column clipboard), HTML5 drag-drop, existing click handlers
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-05-31T00:00:00.000Z'
