ARCH-DEMO_ASSET_PIPELINE:
  alternatives_considered:
    - name: Manual recording only
      cons:
        - Non-reproducible assets
      pros:
        - No Playwright maintenance
      rejected_reason: Automation already exists for CopyAll; extend for comparison
  cross_references:
    - ARCH-TEST_FRAMEWORK
    - REQ-README_DEMO_AUTOMATION
  decision: Modular Playwright E2E specs plus bash fixture scripts produce committed docs/screenshots product tour assets; comparison and CopyAll fixtures are separate; mesh demos use ephemeral MESH_DATA_DIR with mkdtemp depot roots.
  implementation_approach:
    details:
      - convert_all_readme_gifs.sh writes five motion GIFs
      - Each E2E describe beforeAll re-runs its fixture script because demo:setup wipes /tmp/test-dirs between prelude steps
      - readme-mesh-surfaces.spec.ts and readme-mesh-bridge.spec.ts capture Mesh routes and bridge dialogs
      - readme-workspace-dialogs.spec.ts captures fifteen static workspace overlays
      - readme-workspace-motion.spec.ts records four motion demo webms
      - readme-workspace-surfaces.spec.ts captures workspace shell, toolbars, and legacy 3-pane PNGs
    summary: npm demo:screenshots orchestrates setup scripts, six targeted Playwright specs, batch GIF convert, and verify
  metadata:
    created:
      author: AI Agent
      date: "2026-05-30T00:00:00.000Z"
    last_updated:
      author: AI Agent
      date: "2026-05-31T00:00:00.000Z"
      reason: README product tour modular spec split
    last_validated:
      date: "2026-05-30T00:00:00.000Z"
      result: pass
      validator: AI Agent
  name: Demo Asset Pipeline
  rationale:
    benefits:
      - GIF conversion prefers CopyAll webm
      - Per-spec beforeAll restores correct fixture
      - Single demo:screenshots entry point
    problems_solved:
      - Fixture overwrite when chaining npm setup scripts
      - Manual screenshot drift
    why: Documentation visuals are release artifacts requiring deterministic automation
  related_decisions:
    depends_on:
      - ARCH-TEST_FRAMEWORK
    informs:
      - IMPL-DEMO_SCREENSHOT_PIPELINE
    see_also:
      - docs/screenshots/README.md
  status: Active
  traceability:
    code_annotations:
      - REQ-README_DEMO_AUTOMATION
    implementation:
      - IMPL-DEMO_SCREENSHOT_PIPELINE
    requirements:
      - REQ-BUILD_SYSTEM
      - REQ-MESH_GUI
      - REQ-README_DEMO_AUTOMATION
      - REQ-WORKSPACE_MESH_BRIDGE
    tests:
      - e2e/copyall-demo.spec.ts
      - e2e/readme-mesh-bridge.spec.ts
      - e2e/readme-mesh-surfaces.spec.ts
      - e2e/readme-workspace-dialogs.spec.ts
      - e2e/readme-workspace-motion.spec.ts
      - e2e/readme-workspace-surfaces.spec.ts
