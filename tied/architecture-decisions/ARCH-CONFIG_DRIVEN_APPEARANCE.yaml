  status: Active
  cross_references:
    - REQ-CONFIG_DRIVEN_APPEARANCE
    - REQ-CONFIG_DRIVEN_UI
  decision: 'Extend the configuration-driven UI so that every page and shared component gets appearance and layout from one or more configuration files. No route or component may rely on hard-coded layout classes, spacing, colors, or user-facing copy; all such values are sourced from `config/site.yaml`, `config/theme.yaml`, and `config/jobs.yaml` (or extended sections). This ensures the project serves as a highly-configurable template with a single, consistent pattern: config dictates what users see and how it looks.'
