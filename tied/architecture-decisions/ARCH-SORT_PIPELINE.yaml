ARCH-SORT_PIPELINE:
  alternatives_considered:
    - cons:
        - More complex state management
        - Network latency on every sort
      option: Server-side sorting
      pros:
        - Handles very large directories
        - Reduces client bundle size
      rejected_reason: User expects instant sort feedback; latency breaks UX
  cross_references:
    - REQ-FILE_SORTING_ADVANCED
  decision: |-
    Architecture: Composable sort pipeline with pluggable comparators

    ```typescript
    // Sort function signature
    sortFiles(
      files: FileStat[],
      sortBy: SortCriterion,    // "name" | "size" | "mtime" | "extension"
      ascending: boolean,
      dirsFirst: boolean
    ): FileStat[]

    // Comparator composition
    function buildComparator(
      criterion: SortCriterion,
      ascending: boolean,
      dirsFirst: boolean
    ): (a: FileStat, b: FileStat) => number
    ```

    Key Design Principles:

    1. Client-Side Execution: All sorting happens in browser for instant feedback
    2. Comparator Pattern: Separate comparator functions for each criterion
    3. Directory Priority: Optional layer that runs before primary sort
    4. Immutability: Returns new sorted array, preserves original
    5. Cursor Preservation: Track filename before/after sort to maintain cursor position
  implementation_approach:
    details:
      - 'Client-Side Execution: All sorting happens in browser for instant feedback'
      - 'Comparator Pattern: Separate comparator functions for each criterion'
      - 'Cursor Preservation: Track filename before/after sort to maintain cursor position'
      - 'Directory Priority: Optional layer that runs before primary sort'
      - 'Immutability: Returns new sorted array, preserves original'
      - Sort menu Share copies dialog draft into sharedSort without resorting until Shared is clicked
      - Sort menu Shared applies sharedSort to focused pane only (singlePaneOnly bypasses linked-all apply)
      - 'Workspace sharedSort: PaneSortSettings default for new panes; persisted in mesh snapshot v3'
