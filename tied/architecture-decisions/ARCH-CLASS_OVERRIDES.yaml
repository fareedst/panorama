# ARCH detail — ARCH-CLASS_OVERRIDES
ARCH-CLASS_OVERRIDES:
  name: Tailwind Class Override System via Config
  status: Active
  cross_references:
    - REQ-CONFIG_DRIVEN_UI
  decision: Per-element Tailwind CSS class overrides are supported via the `overrides` section in `config/theme.yaml`. Override strings are merged with default component classes using `tailwind-merge`, which intelligently resolves conflicting utilities (e.g., `bg-red-500` overrides `bg-white`).
  rationale:
    why: Allow per-element Tailwind class overrides through configuration
    problems_solved:
      - Hard-coded component classes
      - Difficult styling customization
    benefits:
      - Flexible styling
      - No code changes for styling
  alternatives_considered: []
  implementation_approach:
    summary: Use tailwind-merge to apply config-driven class overrides
    details:
      - Apply to components
      - Define class overrides in theme config
      - Use tailwind-merge to merge classes
