ARCH-CROSS_PANE_VISIBILITY:
  name: Cross-Pane Visibility Architecture
  status: Planned
  cross_references:
    - ARCH-COMPARISON_INDEX
    - ARCH-DISPLAY_FILTER_ENGINE
    - REQ-CROSS_PANE_VISIBILITY
  decision: Client-side visibility engine evaluates comparison-index criteria on the focused pane listing (after display specs), then mirrors visible basenames to other panes. Named presets in a client catalog parallel display specs; each pane keeps activeCrossPaneVisibilityId plus draft; workspace toolbar edits the focused pane draft. Mirroring remains focus-driven (not independent per-pane mirror rules).
  rationale:
    why: Keeps visibility semantics separate from glob display specs and server listing APIs
    problems_solved:
      - Mixing glob and comparison rules
      - Independent per-pane filters breaking compare workflows
    benefits:
      - Client catalog localStorage persistence
      - Per-pane snapshot v5 fields crossPaneVisibilityId and inline crossPaneVisibility
      - Reuse EnhancedCompareState
      - Single engine for include/exclude composition
  implementation_approach:
    summary: cross-pane-visibility.ts + WorkspaceView derivation layer + tri-state toolbar
    details:
      - Apply display spec first then cross-pane visibility on pane.files
      - Build comparison index whenever two or more panes exist for filter criteria
      - Client catalog localStorage persistence panorama.crossPaneVisibility.v1
      - Coloring index still gated by comparisonMode
      - Listing state (path, files, cursor, marks) owned by directory navigation / display-spec pipeline; cross-pane catalog fields merged via MERGE_LISTING_WITH_CROSS_PANE_FIELDS explicit pick only
      - Per-pane snapshot v5 fields crossPaneVisibilityId and inline crossPaneVisibility
      - RECONCILE_AFTER_VISIBILITY on focused pane marks and cursor
  traceability:
    requirements:
      - REQ-CROSS_PANE_VISIBILITY
    implementation:
      - IMPL-CROSS_PANE_VISIBILITY_CATALOG
      - IMPL-CROSS_PANE_VISIBILITY_ENGINE
      - IMPL-CROSS_PANE_VISIBILITY_UI
      - IMPL-WORKSPACE_VIEW
