ARCH-DIRECTORY_TREE:
  cross_references:
    - ARCH-FILE_MANAGER_HIERARCHY
    - REQ-DIRECTORY_TREE
  decision: Pane holds FileTreeState (basePath, expandedPaths, childrenByPath); visible rows are flattened pre-order walk; lazy fetch on expand
  implementation_approach:
    details:
      - fetchDirectoryListing on first expand per node
      - FileTreeState on pane; pane.files = flattenVisibleRows
      - handleNavigate resets tree; refreshPaneTree reloads expanded nodes
      - informs relative path mapping in ARCH-BATCH_OPERATIONS and ARCH-NSYNC_INTEGRATION via sourceBase
      - Linked sync only on handleNavigate not toggleExpand
    summary: Pure file-tree module plus WorkspaceView integration
  name: Directory Tree State Model
  rationale:
    benefits:
      - Lazy load per directory node
      - Path-keyed marks on flattened rows
    problems_solved:
      - Basename-only marks collide across dirs
      - Single flat listing per pane
    why: Separate tree expand from base re-root and support multi-directory operation sources
  related_decisions:
    depends_on:
      - ARCH-FILE_MANAGER_HIERARCHY
      - ARCH-FILESYSTEM_ABSTRACTION
    informs:
      - IMPL-DIRECTORY_TREE
  status: Active
  traceability:
    code_annotations:
      - ARCH-DIRECTORY_TREE
    implementation:
      - IMPL-DIRECTORY_TREE
      - IMPL-FILE_PANE
      - IMPL-WORKSPACE_VIEW
    requirements:
      - REQ-DIRECTORY_TREE
