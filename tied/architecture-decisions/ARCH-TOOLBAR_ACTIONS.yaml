ARCH-TOOLBAR_ACTIONS:
  alternatives_considered:
    - name: Separate button configuration
      cons:
        - Duplication
      pros:
        - Explicit control
      rejected_reason: Single source of truth critical
  cross_references:
    - REQ-KEYBOARD_SHORTCUTS_COMPLETE
    - REQ-TOOLBAR_SYSTEM
  decision: Toolbar buttons derive metadata (icon, label, keystroke, description) from the keybinding registry when present; otherwise from toolbars.actions in config/files.yaml for toolbar-only actions (e.g. view.columns), ensuring consistent dispatch while supporting mouse-only controls without duplicate keybinding rows.
  implementation_approach:
    details:
      - ACTION_ICON_MAP for icon mapping when keybinding supplies action only
      - deriveToolbarButton prefers keybinding registry; falls back to toolbars.actions description/icon/label
      - handleToolbarAction dispatch to existing handlers
      - Icon registry (src/components/icons/registry.ts) merges lucide-icons and panorama-icons; isIconRegistered guards toolbar glyphs
      - Unmapped actions use icon-unknown fallback; help.show remains help-circle
      - view.columns toolbar-only action uses toolbars.actions metadata; opens ColumnOrderDialog without keybinding row
      - view.layout workspace toolbar action opens LayoutPickerPopover (icon layout-grid, Ctrl+Shift+L); replaces header layout select
    summary: Derive icon, label, keystroke from keybinding registry or toolbars.actions fallback
  metadata:
    created:
      author: AI Agent
      date: 2026-02-08T00:00:00.000Z
    last_updated:
      author: AI Agent
      date: "2026-05-29T00:00:00.000Z"
      reason: LEAP — vocabulary see_also back-link
    last_validated:
      date: 2026-02-08T00:00:00.000Z
      result: planned
      validator: AI Agent
  name: Action-to-Button Mapping Architecture
  rationale:
    benefits:
      - Consistent behavior guaranteed
      - Single source of truth
      - Zero duplication
    problems_solved:
      - Code duplication of action handlers
      - Potential inconsistency between toolbar and keyboard
    why: Derive button metadata from keybinding registry to ensure consistency
  related_decisions:
    depends_on:
      - ARCH-KEYBIND_SYSTEM
    informs:
      - IMPL-TOOLBAR_COMPONENT
    see_also:
      - tied/vocab/toolbar-keybind.md
  status: Implemented
  traceability:
    code_annotations:
      - ARCH-TOOLBAR_ACTIONS
    implementation:
      - IMPL-TOOLBAR_COMPONENT
    requirements:
      - REQ-TOOLBAR_SYSTEM
    tests:
      - src/components/icons/registry.test.tsx
      - src/lib/toolbar.utils.test.ts
