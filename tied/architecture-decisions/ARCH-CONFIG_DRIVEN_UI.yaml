ARCH-CONFIG_DRIVEN_UI:
  alternatives_considered:
    - cons:
        - Limited structure
      name: Environment variables
      pros:
        - Simple
      rejected_reason: YAML provides better structure and readability
  cross_references:
    - REQ-CONFIG_DRIVEN_UI
  decision: All page element appearance, layout, and content are driven by two YAML configuration files rather than hard-coded values in TSX and CSS. A typed config loader module reads these files at server render time, merges user values with built-in defaults, and provides them to server components.
  implementation_approach:
    details:
      - Build typed config loader with deep merge
      - Create config/site.yaml for content
      - Create config/theme.yaml for styling
      - Support partial configs with defaults
    summary: Two YAML config files (site.yaml, theme.yaml) with typed loader and deep merge
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: {}
      reason: Migration to v1.5.0
    last_validated:
      date: {}
      result: pass
      validator: AI Agent
  name: YAML Configuration-Driven UI Architecture
  rationale:
    benefits:
      - Easy customization via YAML
      - No code changes needed
      - Separation of concerns
      - Template reusability
    problems_solved:
      - Code changes for appearance
      - Difficult customization
      - Hard-coded UI values
    why: Configuration-driven UI makes the project a highly-configurable template
  related_decisions:
    depends_on:
      - REQ-CONFIG_DRIVEN_UI
    informs:
      - ARCH-CLASS_OVERRIDES
      - ARCH-THEME_INJECTION
    see_also: []
  status: Active
  traceability:
    code_annotations:
      - REQ-CONFIG_DRIVEN_UI
    implementation:
      - IMPL-CONFIG_LOADER
      - IMPL-YAML_CONFIG
    requirements:
      - REQ-CONFIG_DRIVEN_UI
    tests: []
