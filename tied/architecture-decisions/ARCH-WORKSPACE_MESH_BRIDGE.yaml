ARCH-WORKSPACE_MESH_BRIDGE:
  name: Workspace Mesh Bridge Architecture
  status: Accepted
  decision: 'Bridge workspace and mesh via a pure module (workspace-mesh-bridge.ts): pane paths map to local depots; UI state lives in mesh description JSON (workspaceSnapshot v1/v2/v3/v4) and tag workspace-snapshot. Snapshot v4 adds workspace fileColumns; v3 adds sharedSort; v2 adds per-pane displaySpecId; v1 legacy omits later fields with defaults on parse. File manager and mesh remain separate surfaces. Restore uses force-dynamic FilesPage server bootstrap plus client full rehydrate when meshRestorePending (server getMesh miss). Layout aliases normalize to canonical LayoutType at capture, parse, and WorkspaceView init. Layout selection via workspace toolbar view.layout (header layout select removed). Cross-surface navigation uses NewTabLink (target=_blank, rel, a11y disclosure) between Mesh detail and workspace header.'
  implementation_approach:
    summary: Pure bridge module, POST /api/mesh, /files?meshId= restore with dual server/client layout channels
    details:
      - 'Dual-path restore: server RESTORE_ON_FILES_PAGE bootstrap plus client full rehydrate when meshRestorePending (server getMesh miss, client GET /api/mesh/:meshId).'
      - applyMaxPanesLimit truncates restored panes; FilesPage surfaces restoreWarning including layout unreadable cases
      - Compact workspace header banner (WORKSPACE_HEADER_STATUS); status row groups loaded name, amber warnings (restoredFromMesh + restoreWarning), and red errors (bootstrap failure)
      - diffWorkspaceSnapshots compares live state to saved baseline including sharedSort and fileColumns; mesh.diffWorkspace toolbar action
      - File manager shows loaded mesh name; save dialog supports update existing or save as new
      - FilesPage export const dynamic = force-dynamic for per-request meshId restore
      - Layout selection via workspace toolbar view.layout; header layout select removed
      - links array empty on workspace save (linked mode does not create sync links)
      - Loaded mesh name uses copy.workspaceMesh.loadedLabel only; removed loadedMessage copy key; no redundant green success line when name is shown
      - NewTabLink for Open in File Manager and workspace Mesh Sync header (cross-surface new tab)
      - normalizeLayoutType (NORMALIZE_LAYOUT) at snapshot boundaries and restore init
      - Optional human note may prefix description before workspaceSnapshot JSON
      - parseSharedSort defaults v1/v2 to DEFAULT_PANE_SORT; buildWorkspaceRestoreBundle restoreUi includes sharedSort
      - PUT /api/mesh/:meshId/workspace updates description snapshot and syncs depots via planDepotSync
      - Restore precedence over paneN URL query when meshId bootstrap applies (restoredFromMesh)
      - restoreLayout prop plus client meshId fetch for RSC/multi-worker layout rehydrate
      - Shared helpers formatPaneSortSettings and formatDisplaySpecLabel reused by diff and mesh detail summary
      - Shared pure helpers buildWorkspaceRestoreBundle and appendSnapshotLayoutWarnings used by FilesPage and WorkspaceView.
      - Successful workspace update save sets savedSnapshot to the exact captured snapshot so diff badge clears immediately
      - WORKSPACE_HEADER_STATUS shows workspace-restore-pending during client rehydrate; red workspace-restore-error only when client has not recovered; amber warning after clientRestoredFromMesh.
      - WORKSPACE_SNAPSHOT_SUMMARY accepts mesh description, updatedAt, and optional display-spec name resolver; returns note, save time, shared sort label, file columns label, and per-pane sort/display filter/compare filter labels
      - WorkspaceSnapshot v3 includes sharedSort; v2 displaySpecId; v1 base pane fields
      - WorkspaceSnapshot v4 includes fileColumns; capture always writes v4; validateWorkspaceSnapshot accepts v1/v2/v3/v4; v1–v3 omit fileColumns and callers use YAML defaults
      - WorkspaceSnapshotSummaryList (WORKSPACE_SNAPSHOT_SUMMARY_LIST) renders workspace-snapshot-summary on mesh detail with per-pane Compare filter labels; no workspace-level Compare filters aggregate line in GUI
  traceability:
    requirements:
      - REQ-WORKSPACE_MESH_BRIDGE
    implementation:
      - IMPL-WORKSPACE_MESH_BRIDGE
    tests:
      - e2e/workspace-mesh-bridge.spec.ts
      - src/app/api/mesh/[meshId]/workspace/workspace.route.test.ts
      - src/app/api/mesh/workspace-bridge.route.test.ts
      - src/app/files/components/SaveWorkspaceMeshDialog.test.tsx
      - src/app/files/components/WorkspaceDiffDialog.test.tsx
      - src/app/files/page.mesh-restore.test.tsx
      - src/app/files/WorkspaceView.mesh-restore.test.tsx
      - src/app/mesh/components/MeshDetailClient.test.tsx
      - src/app/mesh/components/WorkspaceSnapshotSummaryList.test.tsx
      - src/components/NewTabLink.test.tsx
      - src/lib/files.layout.test.ts
      - src/lib/workspace-mesh-bridge.test.ts
    code_annotations:
      - ARCH-WORKSPACE_MESH_BRIDGE
  related_decisions:
    depends_on:
      - ARCH-FILE_MANAGER_HIERARCHY
      - ARCH-MESH_LAYERED
      - ARCH-PANE_LIFECYCLE
    informs:
      - IMPL-WORKSPACE_MESH_BRIDGE
    see_also: []
