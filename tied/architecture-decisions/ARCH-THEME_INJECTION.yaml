ARCH-THEME_INJECTION:
  name: CSS Variable Injection from Theme Config
  status: Active
  cross_references:
    - REQ-CONFIG_DRIVEN_UI
  decision: 'Theme color values are injected into the document via a `<style>` tag rendered by the root layout component, replacing the previously hard-coded CSS custom property values in `globals.css`. The style tag contains `:root` declarations for light mode and `@media (prefers-color-scheme: dark)` declarations for dark mode, all sourced from `config/theme.yaml`.'
  rationale:
    why: Inject CSS variables from theme config to enable runtime theming
    problems_solved:
