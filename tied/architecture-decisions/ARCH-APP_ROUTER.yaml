ARCH-APP_ROUTER:
  name: Next.js App Router Pattern
  status: Active
  cross_references:
    - REQ-APP_STRUCTURE
    - REQ-NAVIGATION_LINKS
    - REQ-WORKSPACE_MESH_BRIDGE
  decision: Use App Router with src/app/ directory
  rationale:
    why: App Router provides modern routing with server components and improved data fetching
    problems_solved:
      - Complex Pages Router patterns
      - Client-side routing overhead
    benefits:
      - File-based routing
      - Improved data fetching
      - Server components by default
  alternatives_considered:
    - name: Pages Router
      pros:
        - More stable
      cons:
        - Older pattern
      rejected_reason: App Router is the future of Next.js
  implementation_approach:
    summary: App Router with src/app/; NewTabLink for cross-surface new-tab routes
    details:
      - Create src/app/ directory with layout.tsx and page.tsx routes
      - Root / redirects to /files via next/navigation redirect
      - Shared NewTabLink component for Mesh and File Manager cross-surface links with target _blank and rel noopener noreferrer
      - Site config navigation.security documents default target and rel
  traceability:
    requirements:
      - REQ-APP_STRUCTURE
      - REQ-NAVIGATION_LINKS
      - REQ-WORKSPACE_MESH_BRIDGE
    implementation:
      - IMPL-EXTERNAL_LINKS
      - IMPL-HOME_PAGE
      - IMPL-ROOT_LAYOUT
    tests:
      - src/components/NewTabLink.test.tsx
      - src/test/integration/app.test.tsx
    code_annotations:
      - REQ-APP_STRUCTURE
      - REQ-NAVIGATION_LINKS
  related_decisions:
    depends_on:
      - ARCH-NEXTJS_FRAMEWORK
    informs:
      - ARCH-SERVER_COMPONENTS
    see_also:
      - docs/mesh-platform-vocabulary.md
