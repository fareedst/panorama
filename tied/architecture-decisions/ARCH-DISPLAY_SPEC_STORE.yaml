  decision: 'Hybrid catalog: client localStorage (panorama.displaySpecs.v1) is authoritative for edits with change listeners; server mirror at data/display-specs.json and REST /api/display-specs supports GET listing filter (displaySpecId query) and bulk path validation. Panes reference spec by stable uuid id. Delete clears activeDisplaySpecId on affected panes.'
