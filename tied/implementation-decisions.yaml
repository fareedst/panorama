    details:
      - Ensures cursor is in valid range [0, files.length-1] before array access
      - 'Root cause: Guard checked ''cursor < files.length'' but not ''cursor >= 0'''
      - 'Solution: Add ''cursor >= 0'' to guard condition'
      - 'When cursor = -1: -1 < 8 evaluates to true, guard passes but pane.files[-1] = undefined'
    summary: Add cursor >= 0 check to guard condition before accessing pane.files[pane.cursor]
