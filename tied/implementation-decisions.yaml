  name: Cursor Bounds Validation Fix
  rationale:
    benefits:
      - CopyAll/MoveAll operations complete without crashes
      - Handles edge cases where cursor becomes negative
      - Proper validation of cursor before array access
    problems_solved:
      - Accessing pane.files[-1] returns undefined, causing crash on .name access
      - Crash when pane.cursor is -1 (invalid state)
      - Guard condition only checked upper bound, not lower bound
    why: Fix runtime crash in handleNavigate when cursor is negative by adding proper bounds validation
