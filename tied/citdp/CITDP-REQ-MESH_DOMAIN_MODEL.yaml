      New L1 module src/lib/mesh/domain/ (types, internal, validators, serialize, index) isolated from fs/HTTP/DB.
      Boundaries: public exports via index.ts only; internal.ts not re-exported. Coexists with src/lib/sync/ (nsync).
      Tests colocated: validators.test.ts, serialize.test.ts, domain.composition.test.ts, domain.test-helpers.ts.
    impl_inventory_notes: |
