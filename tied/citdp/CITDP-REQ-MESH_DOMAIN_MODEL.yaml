  change_definition:
    summary: |
      Introduce a pure TypeScript mesh domain module (mesh, depot, sync link, policy, filter, credential reference,
      sync session, change set, operations, events, conflict) with construction-time validation, JSON-safe DTO
      serialization, and immutable mesh snapshots — foundation for later mesh services without altering pane nsync.
    current_behavior_prior: |
      No shared mesh vocabulary or validation in src/lib/mesh/; multi-pane sync remains REQ-NSYNC_MULTI_TARGET under src/lib/sync/.
    desired_behavior: |
      Callers construct and validate domain entities via synchronous pure functions; invalid inputs yield DomainValidationError;
      TO_DTO/FROM_DTO round-trip mesh and credential references without secret fields; CREATE_MESH_SNAPSHOT deep-clones mesh for sessions.
    unchanged_behavior: |
      Pane-level nsync (Shift+C/V, multi-destination copy) and existing Next.js file manager UI unchanged. No mesh API routes or GUI in this slice.
    non_goals:
      - Persistence, connectors, mesh API, or mesh GUI (later REQ slices)
      - Playwright E2E for phase 1 (no UI-only behavior)
      - Replace or extend src/lib/sync/ as the mesh engine
    success_criteria:
      - Module validated independently per REQ-MODULE_VALIDATION before L2+ integration
      - REQ status Implemented; IMPL-MESH_DOMAIN_TYPES Active; tied_validate_consistency ok
      - REQ-MESH_DOMAIN_MODEL satisfaction criteria covered by Vitest in src/lib/mesh/domain/
    references:
