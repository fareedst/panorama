  risk_analysis:
    risks:
      - id: RISK-MESH-001
        description: |
          Developers confuse mesh domain (src/lib/mesh/) with pane nsync (src/lib/sync/) and wire the wrong module.
        severity: Medium
        likelihood: Medium
        mitigation: ARCH-MESH_LAYERED documents separation; CITDP and agent-preload-contract name both paths; no imports between modules in phase 1.
      - id: RISK-MESH-002
        description: |
          Secret material appears in serialized mesh or credential DTOs.
        severity: High
        likelihood: Low
        mitigation: VALIDATE_CREDENTIAL_REFERENCE rejects secret fields; serialize tests assert no leakage on round-trip.
      - id: RISK-MESH-003
        description: |
          Invalid mesh graphs accepted without validation before later services persist them.
        severity: Medium
        likelihood: Low
        mitigation: VALIDATE_MESH orchestrates depot/link/policy checks; invalid_core_objects_are_rejected unit tests.
      - id: RISK-MESH-004
        description: |
          Live mesh configuration mutated during sync session via shared object references.
        severity: Medium
        likelihood: Low
        mitigation: CREATE_MESH_SNAPSHOT uses deep clone; sync_session_requires_mesh_snapshot tests.
