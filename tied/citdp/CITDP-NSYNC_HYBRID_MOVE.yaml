CITDP-NSYNC_HYBRID_MOVE:
  change_definition:
    current_behavior: Move to All builds per-item MovePlan; executeMovePlan runs legs sequentially with EXDEV-safe renameOrMove; post-rename verify skipped when verifyDestination enabled; copy legs still verify.
    desired_behavior: Per-item MovePlan classifies volume affinity; executes cross-volume copies first, same-volume copies for extra same-volume targets, single same-volume rename last; omits deferred delete when final leg is rename; skip verify after atomic same-volume rename only.
    non_goals:
      - Changing Copy to All (move:false)
      - Directory MovePlan unless NSYNC gains directory support
      - Hard-link optimization for duplicate same-volume dests
      - Mesh subsystem moves
      - Progress UI for long cross-volume copies
    success_criteria:
      - buildMovePlan unit tests cover destination mix matrix and single-rename invariant
      - engine.test.ts mixed A+A+B uses one cross-volume copy, one rename, no deferred delete
      - pseudocode_validate and tied_validate_consistency pass after all TIED writes
      - REQ-MOVE_SEMANTICS preserved on partial failure
      - Shared EXDEV executor; renameFile EXDEV fallback; files.data tests unchanged
      - Verify skipped after atomic same-volume rename only; copy legs still verify
      - Vocabulary RECORD in tied/vocab/nsync-multi-target.md
