IMPL-CONFIG_DRIVEN_APPEARANCE:
  name: Config-Driven Appearance Implementation
  status: Active
  cross_references:
    - ARCH-CONFIG_DRIVEN_APPEARANCE
    - REQ-CONFIG_DRIVEN_APPEARANCE
  decision: File-manager appearance and copy come from config/site.yaml, config/theme.yaml, and config/files.yaml via getSiteConfig, getThemeConfig, getFilesConfig, getFilesOverride, and getFileTypeConfig. Jobs tracker UI and jobs config were removed in the file-manager sole-purpose refactor.
  rationale:
    why: File-manager UI must be fully configurable from YAML without hard-coded copy or presentation
    problems_solved:
      - Hard-coded file-manager layout and copy
      - Obsolete jobs config paths after sole-purpose refactor
    benefits:
      - File-manager appearance fully config-driven
      - Template reusable via config edits only
  implementation_approach:
    summary: YAML-driven file manager copy, layout, theme classes, and file-type icons (jobs scope retired)
    details:
      - getFilesConfig supplies WorkspaceView copy and layout
      - getFileTypeConfig and theme.files.fileTypes drive row icons
      - getSiteConfig supplies layout metadata
      - Historical jobs loader and pages removed
  code_locations:
    files:
      - path: src/lib/config.ts
        description: getFilesConfig, getFilesOverride, getFileTypeConfig
      - path: config/files.yaml
        description: File manager copy and layout
      - path: config/theme.yaml
        description: Theme and files.fileTypes
      - path: config/site.yaml
        description: Site metadata
      - path: src/app/files/page.tsx
        description: Server passes config into WorkspaceView
    functions:
      - name: getFilesConfig
        file: src/lib/config.ts
        description: Merged files config
      - name: getFileTypeConfig
        file: src/lib/config.ts
        description: Icon lookup by filename
  traceability:
    architecture:
      - ARCH-CONFIG_DRIVEN_APPEARANCE
    requirements:
      - REQ-CONFIG_DRIVEN_APPEARANCE
    tests:
      - src/lib/config.test.ts
    code_annotations:
      - REQ-CONFIG_DRIVEN_APPEARANCE
  related_decisions:
    depends_on: []
    supersedes: []
    see_also:
      - IMPL-CONFIG_LOADER
  metadata:
    created:
      date: 2025-11-08T00:00:00.000Z
      author: AI Agent
    last_updated:
      date: "2026-05-29T00:00:00.000Z"
      author: AI Agent
      reason: LEAP jobs retired; pseudocode matches file-manager config
    last_validated:
      date: "2026-05-29T00:00:00.000Z"
      validator: AI Agent
      result: pass — LEAP stack aligned with REQ and ARCH
