IMPL-NSYNC_ENGINE:
  name: Sync Engine Core Implementation
  status: Active
  cross_references:
    - ARCH-NSYNC_INTEGRATION
    - REQ-MOVE_SEMANTICS
    - REQ-NSYNC_MULTI_TARGET
  decision: SyncEngine class orchestrates sync loop iterating over sources, syncing each to all destinations in parallel, tracking results, and handling move deletion
  rationale:
    why: Implements multi-destination file synchronization engine orchestrating parallel sync with observer pattern, move semantics, and store monitoring
    problems_solved:
      - No progress tracking during long operations
      - Sequential sync to multiple destinations is slow
      - Source deleted before all destinations verified
    benefits:
      - Parallel sync to all destinations
      - Real-time progress callbacks via observer
      - Safe move semantics (delete source only after ALL succeed)
      - Store failure detection and abort
  implementation_approach:
    summary: SyncEngine class orchestrates sync loop iterating over sources, syncing each to all destinations in parallel, tracking results, and handling move deletion
    details:
      - 'For each source: syncItem() syncs to all destinations via Promise.all'
      - 'Move semantics: track sourcesToDelete, delete only after ALL destinations succeed'
      - 'Observer callbacks: onStart, onItemStart, onItemProgress, onItemComplete, onProgress, onFinish'
      - 'sync() method: validate inputs, build plan, iterate sources'
      - StoreMonitor tracks error streaks, marks stores unavailable
      - SyncEngine constructor accepts optional SyncObserver
      - syncToDestination() handles single source->dest copy with compare, hash, verify
