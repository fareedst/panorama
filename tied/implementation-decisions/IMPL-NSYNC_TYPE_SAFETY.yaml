IMPL-NSYNC_TYPE_SAFETY:
  name: TypeScript Type Safety for Node.js Types
  status: Active
  cross_references:
    - IMPL-NSYNC_ENGINE
    - IMPL-NSYNC_HASH
  decision: Add type guards and conversions to handle Node.js bigint sizes and stream types; fix import statements to allow value usage
  rationale:
    why: Handle Node.js type incompatibilities (bigint file sizes, stream types, import type restrictions) to pass TypeScript strict mode compilation
    problems_solved:
      - ErrorClass imported as type but used as value (enum access)
      - stat.size is number | bigint but code expected only number
      - Stream 'data' event emits string | Buffer but code expected only Buffer
    benefits:
      - Correct stream type handling
      - Production-ready TypeScript build
      - Type-safe handling of large files (bigint support)
      - Zero TypeScript compilation errors
  implementation_approach:
    summary: Add type guards and conversions to handle Node.js bigint sizes and stream types; fix import statements to allow value usage
    details:
      - 'Apply conversion in 3 locations: plan.totalBytes, result.bytesCopied, ItemInfo.size'
      - 'Convert stat.size bigint to number: typeof stat.size === ''bigint'' ? Number(stat.size) : stat.size'
      - 'Fix ErrorClass import: move from ''import type'' to regular import'
      - 'Fix NoopObserver import: move from separate import to regular import'
      - 'Handle stream chunk types: typeof chunk === ''string'' ? Buffer.from(chunk) : chunk'
  code_locations:
    files:
      - path: src/lib/sync/engine.ts
        description: Type conversions for stat.size (3 locations), ErrorClass import fix
        lines:
          - 169
          - 261
          - 7
          - 89
      - path: src/lib/sync/hash.ts
        description: Stream chunk type handling
        lines:
          - 111
          - 114
