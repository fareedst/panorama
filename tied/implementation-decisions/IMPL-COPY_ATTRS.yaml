IMPL-COPY_ATTRS:
  name: Copy Preserve File Attributes
  status: Active
  cross_references:
    - IMPL-FILES_DATA
    - IMPL-NSYNC_OPERATIONS
    - REQ-COPY_OPERATIONS
    - REQ-FILE_OPERATIONS
  decision: Shared preserveCopyAttributes() after fs.copyFile; stat source then chmod + utimes on dest; each step try/catch so unsupported or denied ops do not fail the copy
  rationale:
    why: Copying a file with nsync or simpler methods must maintain attributes (mode, timestamps) where possible
    benefits:
      - 'Best-effort: copy still succeeds if chmod/utimes fail'
      - Preserves mode (permissions) on Unix
      - Preserves mtime/atime for comparison and backup semantics
  implementation_approach:
    summary: Shared preserveCopyAttributes() after fs.copyFile; stat source then chmod + utimes on dest; each step try/catch so unsupported or denied ops do not fail the copy
  code_locations:
    files:
      - path: src/lib/copyAttributes.ts
        description: preserveCopyAttributes() helper
      - path: src/lib/sync/operations.ts
        description: Called after copyFile
      - path: src/lib/files.data.ts
        description: Called after copyFile
