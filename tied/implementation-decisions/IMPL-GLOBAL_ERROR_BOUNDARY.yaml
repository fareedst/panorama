IMPL-GLOBAL_ERROR_BOUNDARY:
  name: Global Error Boundary Implementation
  status: Active
  cross_references:
    - ARCH-NEXTJS_FRAMEWORK
    - REQ-ERROR_HANDLING
  decision: Implement a root-level error boundary component (`global-error.tsx`) that catches unexpected errors at the root layout level and provides users with a friendly error message and recovery option in production.
  rationale:
    why: Provides root-level error recovery with full HTML document
    problems_solved:
      - Application crashes on errors
      - No error recovery
    benefits:
      - Graceful error recovery
      - Better error UX
  implementation_approach:
    summary: Root-level global-error.tsx client boundary with full HTML document, recovery UI, and error digest
    details:
      - Collapsible details show error.message and optional digest
      - Render html, head, body with self-contained inline styles
      - Try again button calls reset(); home link to /
      - use client directive for reset() and onClick
