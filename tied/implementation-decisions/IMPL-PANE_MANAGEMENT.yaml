IMPL-PANE_MANAGEMENT:
  name: Runtime Pane Management Controls
  status: Active
  cross_references:
    - ARCH-KEYBIND_SYSTEM
    - ARCH-PANE_LIFECYCLE
    - REQ-FILES_CONFIG_COMPLETE
    - REQ-MULTI_PANE_LAYOUT
    - REQ-TOOLBAR_SYSTEM
  decision: Add/remove/swap/cycle pane handlers with config validation, keyboard shortcuts, pane order dialog, command palette integration
  rationale:
    why: Implements runtime controls for adding and removing file panes to support flexible multi-panel workflows per ARCH-PANE_LIFECYCLE
    problems_solved:
      - Cannot adapt layout to current task needs
      - No UI affordance for pane management
      - Pane count fixed at initialization
      - Users cannot adjust pane count without reloading page
    benefits:
      - Config validation prevents invalid states
      - Dynamic workflow adjustment without page reload
      - Keyboard shortcuts integrate with existing keybind system
      - Respects user's maxPanes and allowPaneManagement preferences
  implementation_approach:
    summary: Add/remove/swap/cycle pane handlers with config validation, keyboard shortcuts, pane order dialog
    details:
      - 'Command palette actions: pane.add, pane.remove, pane.swap, pane.swapPrev, pane.cycle, pane.cyclePrev, pane.order'
      - 'handleAddPane(): Check allowPaneManagement and maxPanes limit, clone focused pane'
      - 'handleApplyPaneOrder(order): reorder by index permutation from PaneOrderDialog'
      - 'handleCyclePanes(direction): rotate panes[], remap focus and history'
      - 'handleRemovePane(index): Check allowPaneManagement and minimum 1 pane, adjust focusIndex'
      - 'handleSwapFocusedNext/Prev(): two panes swap 0↔1; else swap focus with neighbor'
      - 'handleSwapPanes(i,j): swap panes array, remap focusIndex, permute directory history'
      - 'Keyboard shortcuts: = add, - remove; Ctrl+Shift+S swap; Ctrl+Shift+] cycle forward'
      - 'pane-order.ts: swapArrayAt, rotateArray, moveArrayAt, focus remap helpers'
      - State updates trigger comparison index rebuild and layout recalculation
  code_locations:
    files:
      - path: src/lib/pane-order.ts
        description: Pure pane reorder helpers
        lines:
          - 1
          - 100
      - path: src/app/files/components/PaneOrderDialog.tsx
        description: Pane order dialog
