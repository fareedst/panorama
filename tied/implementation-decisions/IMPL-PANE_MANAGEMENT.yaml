        description: Pane reorder handlers and keybinding integration
        lines:
          - 1385
          - 1550
    functions:
      - name: handleSwapPanes
        file: src/app/files/WorkspaceView.tsx
        description: Swap two pane indices with focus and history remap
      - name: handleCyclePanes
        file: src/app/files/WorkspaceView.tsx
        description: Rotate all panes one slot
      - name: handleApplyPaneOrder
        file: src/app/files/WorkspaceView.tsx
        description: Apply dialog index order to panes[]
