    details:
      - Icon registry in src/components/icons (lucide-icons, panorama-icons, registry.ts); getReferencedToolbarIconNames for test coverage
      - mergeTopToolbarConfigs merges enabled top-position tiers for compact single-row layout
      - ToolbarButton showKeystroke prop hides badge while preserving tooltip shortcuts
      - ToolbarCompactToggle leading control toggles session compact/expanded display
      - useElementSize on workspace-area ref remeasures pane bounds when toolbar compact/expanded toggles
