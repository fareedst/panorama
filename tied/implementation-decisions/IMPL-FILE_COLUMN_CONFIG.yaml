  decision: Config-driven file metadata columns with tabular CSS grid rows, content-measured Size/Time ch tracks, workspace column-order dialog (view.columns), OneColumn shared metadata widths, and mesh workspace snapshot v4 fileColumns persistence.
  implementation_approach:
    details:
      - captureWorkspaceSnapshot version 4 includes fileColumns; parse v1–v3 omit uses YAML defaults
      - config/files.yaml columns and copy.columns; toolbars.actions.view.columns for toolbar-only metadata
      - deriveToolbarButton falls back to toolbars.actions when no keybinding
      - FilePane tabular rows (file-row-grid) without listing header row; optional metadataColumnWidths from workspace
      - src/lib/file-columns.ts — getVisibleFileColumns, reorderFileColumns, normalizeFileColumns, measure widths, buildFileRowGridTemplate, formatFileColumnCell, formatFileColumnsLabel
      - WorkspaceView fileColumns state; view.columns opens ColumnOrderDialog; OneColumn shared metadata ch
    summary: file-columns.ts helpers; FilePane CSS grid; ColumnOrderDialog; WorkspaceView state; mesh v4 capture/parse/diff
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-08-27'
      reason: 'E1 tranche 4: migrate legacy CONTRACT/PROCEDURE blocks to fenced Layer-B format'
    last_validated:
      date: '2026-05-23T00:00:00.000Z'
      result: pending vitest gate
      validator: AI Agent
  name: Configurable File Column Display
  rationale:
    benefits:
      - Column order dialog via toolbar view.columns (no shortcut)
      - 'Default order optimized for most recent changes: mtime, size, name'
      - Full integration with existing config-driven architecture
      - Mesh snapshot v4 round-trips fileColumns
      - Tabular grid aligns metadata; Name column flex remainder
      - 'Users can hide unwanted columns (visible: false)'
    problems_solved:
      - Column display not integrated with existing YAML configuration system
      - Column order was YAML-only with no in-session reorder or mesh restore
      - Flex rows did not align metadata across panes in OneColumn layout
      - Hard-coded column order (checkbox, icon, name, size, mtime) cannot be changed
      - No way to hide/show specific columns based on user preference
    why: Implements configurable column display for file panes to meet user requirement for customizable file metadata display order and format
  related_decisions:
    depends_on:
      - ARCH-CONFIG_DRIVEN_UI
      - IMPL-FILE_PANE
