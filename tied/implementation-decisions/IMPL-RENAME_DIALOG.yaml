IMPL-RENAME_DIALOG:
  name: Rename File Dialog and R-Key Handler
  status: Active
  cross_references:
    - ARCH-KEYBIND_SYSTEM
    - IMPL-KEYBINDS
    - IMPL-MOUSE_SUPPORT
    - REQ-FILE_OPERATIONS
    - REQ-KEYBOARD_SHORTCUTS_COMPLETE
    - REQ-MOUSE_INTERACTION
  decision: RenameDialog component, rename state in WorkspaceView, file.rename handler and onRename(file) callback; handleRenameConfirm calls POST /api/files rename then refreshes pane
  rationale:
    why: Implements the file.rename action so that keystroke R and context menu Rename open a modal and perform rename via existing API
    problems_solved:
      - 'No UI for single-file rename despite POST /api/files operation: rename already existing'
      - Context menu Rename had no wired handler from WorkspaceView
      - Keystroke 'r' to rename did nothing (handler was TODO/no-op)
    benefits:
      - 'Pane refresh after rename via handleNavigate; footer shows ''R: Rename'' hint'
      - R key opens rename dialog for cursor file; context menu Rename opens dialog for right-clicked file
      - Single RenameDialog component; same API flow for both entry points
  implementation_approach:
    summary: RenameDialog component, rename state in WorkspaceView, file.rename handler and onRename(file) callback; handleRenameConfirm calls POST /api/files rename then refreshes pane
    details:
      - 'ContextMenu: call onRename(file) instead of onRename(); ContextMenu.test updated to expect onRename(mockFile)'
      - 'file.rename action handler: get pane.files[pane.cursor]; if file, setRenameDialog with file.path, file.name, focusIndex'
      - 'FilePane onRename: (file: FileStat) => void; pass onRename={(file) => setRenameDialog(...)} so context menu opens dialog for that file'
      - 'Footer: added ''R: Rename'' hint'
      - 'RenameDialog.tsx: modal with initialName input, onConfirm(newName), onClose; ESC to cancel'
      - 'WorkspaceView: renameDialog state { isOpen, filePath, fileName, paneIndex }; handleRenameConfirm(filePath, paneIndex, newName) builds dest path, POST operation rename, handleNavigate(paneIndex, dir)'
