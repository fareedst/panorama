REQ-MESH_DOMAIN_MODEL:
  name: Mesh Domain Language and Core Types
  category: Functional
  priority: P0
  status: Implemented
  description: 'Stable vocabulary and smallest domain objects for mesh sync: mesh, depot, sync link, policy, filter, credential reference, sync session, change set, sync operation, sync event, and conflict—with validation and serialization contracts.'
  rationale:
    why: Sponsor deployment phase 1 (domain_language_and_core_types) must be formalized before CRUD, connectors, or GUI.
    problems_solved:
      - No serialization contract for persistence and API
      - No shared domain model for mesh configuration and runtime
      - No validation rules for invalid mesh/depot/link/session objects
    benefits:
      - All later phases compose testable units on stable types
      - Explicit rejection of invalid domain instances
      - Independent construction and round-trip serialization of core objects
  satisfaction_criteria:
    - criterion: All core objects can be constructed independently and serialized; invalid objects are rejected
    - criterion: Change set contains ordered sync operations
    - criterion: Conflict has type, participants, and status
    - criterion: Credential reference never exposes secret material in serialization
    - criterion: Depot requires name, kind, and root; connector reference validated per kind
    - criterion: Mesh requires a non-empty name; accepts zero or more depots when modeled
    - criterion: Policy has safe default values (non-destructive defaults)
    - criterion: Sync link requires valid source and target depot references
    - criterion: Sync session requires an immutable mesh configuration snapshot
  validation_criteria:
    - method: Unit tests (Vitest)
      coverage: src/lib/mesh/domain/validators.test.ts, serialize.test.ts, domain.composition.test.ts — mesh_requires_name through invalid_core_objects_are_rejected
