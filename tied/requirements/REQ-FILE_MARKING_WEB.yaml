REQ-FILE_MARKING_WEB:
  name: Web-Based File Marking for Batch Operations
  category: Functional
  priority: P0
  status: Implemented
  description: |-
    Users must be able to mark and unmark individual files within a web-based directory listing for batch operations. Marked files are visually distinguished from unmarked files using checkbox icons and background highlighting. The system must support marking/unmarking individual files, toggling marks on all visible rows, and clearing all marks. Mark state persists when re-sorted or tree-refreshed by absolute file.path (path-based when directory tree spans multiple subdirectories). Marked files participate in batch operations (copy, move, delete) as a group.

    Canonical terms: tied/vocab/file-marking.md; pseudo-code blocks MarkToggle, MarkAll, ClearMarks in IMPL-FILE_MARKING-pseudocode.md.
  rationale:
    why: Batch operations on multiple files require a selection mechanism optimized for web interfaces
    problems_solved:
      - Complex multi-file selection patterns with mouse/keyboard
      - Loss of selection after view refresh or sorting
      - Tedious individual file operations in web UI
    benefits:
      - Clear visual feedback via checkboxes and highlighting
      - Efficient batch operations on arbitrary file sets
      - Keyboard-driven marking workflow (Space, Shift+M, Escape)
      - Persistent client-side selection across sorting/filtering
  satisfaction_criteria:
    - criterion: 'Pane footer displays marked count: [marked/total]'
    - criterion: Batch operations operate on marked files when marks exist
    - criterion: Mark persistence is path-based when tree spans multiple directories (absolute file.path)
    - criterion: Mark state persists when tree is refreshed or re-sorted within visible rows
    - criterion: Marked files visually distinguished with checkbox icon and background color
    - criterion: Parent directory entry (..) cannot be marked
    - criterion: Terminology aligns with tied/vocab/file-marking.md
    - criterion: Users can clear all marks with Escape key
    - criterion: Users can mark all visible rows (Shift+M) and invert marks (Ctrl+M)
    - criterion: Users can mark individual files by toggling with Space key or checkbox click
  validation_criteria:
    - method: Unit tests
      coverage: Mark toggle, mark all, invert, clear operations
    - method: Unit tests
      coverage: Mark persistence across sort/filter/refresh
    - method: Integration tests
      coverage: Batch operations use marked files correctly
    - method: UI tests
      coverage: Visual distinction of marked files
  traceability:
    architecture:
      - ARCH-MARKING_STATE
    implementation:
      - IMPL-FILE_MARKING
    tests:
      - TEST-FILE_MARKING
    code_annotations:
      - REQ-FILE_MARKING_WEB
  related_requirements:
    depends_on:
      - REQ-FILE_LISTING
      - REQ-KEYBOARD_NAVIGATION
    related_to:
      - REQ-BULK_FILE_OPS
      - REQ-DIRECTORY_TREE
    supersedes: []
