REQ-MESH_GUI:
  name: Mesh Web GUI
  category: Functional
  priority: P1
  status: Implemented
  description: 'Mesh UI at src/app/mesh: list, detail, topology, plan, sync, conflicts, schedule, export, history, rules, settings, per-mesh depots page. Canonical terms: tied/vocab/mesh-platform.md; two-phase plan approve then sync start per IMPL-MESH_GUI-pseudocode.'
  rationale:
    why: Deployment plan phases 17-22.
    problems_solved:
      - No visual mesh management
    benefits:
      - Operators can inspect topology and plans
  satisfaction_criteria:
    - criterion: menu_reaches_schedule_export_history_archive_settings
    - criterion: mesh_list_displays_mesh_name_state_and_depot_count
    - criterion: mesh_list_displays_note_and_most_recent_save_time
      description: Mesh list Note column shows extractNotePrefixFromDescription(description); Most recent save time column shows formatDateTime(updatedAt); testids mesh-list-note and mesh-list-updated-at
    - criterion: mesh_list_sortable_column_headers_toggle_order
      description: SortableHeader buttons toggle client sortColumn/sortDirection per column with aria-sort; testids mesh-list-sort-*
    - criterion: per_mesh_depots_page_supports_depot_crud
      description: Operator reaches /mesh/:meshId/depots; MeshDepotsClient adds and removes depots via form; testids mesh-depots, add-depot-*, depot-summary, manage-credentials-btn
    - criterion: mesh_list_files_startup_column_sets_preference
    - criterion: plan_page_approves_session_without_starting_sync
    - criterion: sync_page_starts_approved_session_from_sessionStorage_handoff
    - criterion: terminology_aligns_with_docs_mesh_platform_vocabulary
    - criterion: user_can_reach_every_major_feature_from_menu
      description: Files startup radio per row persists to localStorage via setFilesStartupMeshId; summary and Use config defaults clear control; testids mesh-list-files-startup-*, files-startup-mesh-summary, files-startup-mesh-clear
  validation_criteria:
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshListClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshDetailClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshDepotsClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/PlanViewClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/ConflictsClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/SyncSessionClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/TopologyGraphClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshScheduleClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshExportClient.test.tsx
    - method: Vitest RTL
      coverage: src/app/mesh/components/MeshArchiveClient.test.tsx
    - method: Playwright
      coverage: e2e/mesh-sync.spec.ts
  traceability:
    architecture:
      - ARCH-MESH_LAYERED
    implementation:
      - IMPL-MESH_GUI
    tests:
      - e2e/mesh-sync.spec.ts
      - src/app/mesh/components/MeshArchiveClient.test.tsx
      - src/app/mesh/components/MeshDepotsClient.test.tsx
      - src/app/mesh/components/MeshExportClient.test.tsx
      - src/app/mesh/components/MeshListClient.test.tsx
      - src/app/mesh/components/MeshScheduleClient.test.tsx
    code_annotations:
      - REQ-MESH_GUI
  related_requirements:
    depends_on:
      - REQ-MESH_API
    related_to:
      - REQ-MESH_PLATFORM
    supersedes: []
