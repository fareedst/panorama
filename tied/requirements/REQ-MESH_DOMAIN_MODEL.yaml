REQ-MESH_DOMAIN_MODEL:
  category: Functional
  description: 'Define mesh, depot, sync_link, policy, filter, credential_reference, sync_session, change_set, sync_operation, sync_event, and conflict as language-agnostic domain types with validation and serialization. Outputs: domain_model, object_validation_rules, serialization_contracts. Deployable: false (domain-only slice).'
  metadata:
    created:
      author: AI Agent
      date: "2026-05-19T00:00:00.000Z"
    last_updated:
      author: AI Agent
      date: "2026-05-19T20:15:00.000Z"
      reason: 'sync-tied-stack: tied_verify after 50/50 mesh domain Vitest pass'
  name: Mesh Domain Language and Core Types
  priority: P0
  rationale:
    benefits:
      - Deterministic validation at construction time
      - Serialization safe for API and persistence layers
      - TDD-friendly pure domain module
    problems_solved:
      - Ad-hoc structs without shared invariants
      - Ambiguous session vs configuration mutability
      - Secrets embedded in domain documents
    why: Foundation for mesh CRUD, topology, planning, sessions, and GUI; must exist before production modules under src/lib/mesh/.
  related_requirements:
    depends_on:
      - REQ-MESH_PLATFORM
    related_to:
      - REQ-MESH_PLATFORM
      - REQ-MODULE_VALIDATION
    supersedes: []
  satisfaction_criteria:
    - criterion: all_core_objects_can_be_constructed_independently
    - criterion: all_core_objects_can_be_serialized (round-trip without secret leakage)
    - criterion: change_set_contains_ordered_operations
    - criterion: conflict_has_type_participants_and_status
    - criterion: credential_reference_does_not_expose_secret_material
    - criterion: depot_requires_name_kind_and_root
    - criterion: invalid_core_objects_are_rejected with explicit errors
    - criterion: mesh_accepts_zero_or_more_depots — empty depot list allowed for new/incomplete mesh
    - criterion: mesh_requires_name — reject mesh without name
    - criterion: policy_has_default_safe_values
    - criterion: sync_link_requires_valid_source_and_target_depots
    - criterion: sync_session_requires_mesh_snapshot
  status: Implemented
  traceability:
    architecture:
      - ARCH-MESH_DOMAIN
      - ARCH-MESH_LAYERED
    code_annotations:
      - REQ-MESH_DOMAIN_MODEL
    implementation:
      - IMPL-MESH_DOMAIN_TYPES
    tests:
      - src/lib/mesh/domain/domain.composition.test.ts
      - src/lib/mesh/domain/serialize.test.ts
      - src/lib/mesh/domain/validators.test.ts
  validation_criteria:
    - method: Unit tests (Vitest)
      coverage: src/lib/mesh/domain/validators.test.ts, serialize.test.ts, domain.composition.test.ts — mesh_requires_name through invalid_core_objects_are_rejected
    - method: tied_validate_consistency
      coverage: REQ-MESH_DOMAIN_MODEL traceability after sync-tied-stack
