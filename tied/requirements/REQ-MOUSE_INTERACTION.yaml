REQ-MOUSE_INTERACTION:
  category: Functional
  description: Web users expect mouse and touch interaction support for common file operations. While keyboard-driven workflows are efficient for power users, mouse support improves accessibility and provides familiar interaction patterns for users transitioning from traditional file managers.
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-06-01T00:00:00.000Z'
      reason: LEAP — double-click toggles tree expand not re-root
    last_validated:
      date: {}
      result: pass - 554 tests passing, production build successful
      validator: AI Agent
  name: Mouse and Touch Interaction
  priority: P2
  rationale:
    benefits:
      - Click to select and navigate
      - Drag-and-drop file operations
      - Right-click context menu
      - Touch-friendly on tablets
    problems_solved:
      - Cannot drag-drop files between panes
      - Keyboard-only interface not accessible to all users
      - No context menu for common operations
    why: Web users expect mouse and touch interaction support
  related_requirements:
    depends_on:
      - REQ-FILE_OPERATIONS
    related_to:
      - REQ-KEYBOARD_NAVIGATION
      - REQ-PANE_COMMAND_EXEC
      - REQ-TOUCH_MTIME
    supersedes: []
  satisfaction_criteria:
    - criterion: cross_pane_paths_disabled_when_basename_missing_from_listings — cross-pane copy action disabled when no pane listing contains the basename
    - criterion: double_click_toggle_directory_expand — double-click on directory row toggles tree expand/collapse; files unchanged
    - criterion: Drag-and-drop moves/copies files between panes
    - criterion: execute_menu_on_file_rows — unified ContextMenu shows Execute… for file and directory rows (REQ-PANE_COMMAND_EXEC)
    - criterion: file_column_right_click_shows_clipboard_menu — Copy filename, Copy path, Copy paths in all panes within unified ContextMenu clipboard section
    - criterion: Left-click selects file and moves cursor
    - criterion: make_directory_menu_on_file_rows — unified ContextMenu shows Make directory… for file and directory rows (REQ-DIRECTORY_NAVIGATION)
    - criterion: rename_regex_menu_on_file_rows — unified ContextMenu shows Rename Regex… for file and directory rows (REQ-BULK_FILE_OPS)
    - criterion: Right-click shows context menu with operations
    - criterion: Scroll wheel navigates file list
    - criterion: set_base_directory_menu_on_directory_rows — directory rows show Set as Base directory menu item; file rows unchanged
    - criterion: Touch gestures work on tablets
    - criterion: touch_menu_on_file_rows — unified ContextMenu shows Touch… for file and directory rows (REQ-TOUCH_MTIME)
    - criterion: unified_file_context_menu_on_row_and_column_right_click — row and metadata-cell right-click open one ContextMenu with file operations, clipboard section, and Set as Base directory on directories
