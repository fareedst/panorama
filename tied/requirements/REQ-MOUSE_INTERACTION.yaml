REQ-MOUSE_INTERACTION:
  name: Mouse and Touch Interaction
  category: Functional
  priority: P2
  status: Implemented
  description: Web users expect mouse and touch interaction support for common file operations. While keyboard-driven workflows are efficient for power users, mouse support improves accessibility and provides familiar interaction patterns for users transitioning from traditional file managers.
  rationale:
    why: Web users expect mouse and touch interaction support
    problems_solved:
      - Cannot drag-drop files between panes
      - Keyboard-only interface not accessible to all users
      - No context menu for common operations
    benefits:
      - Click to select and navigate
      - Drag-and-drop file operations
      - Right-click context menu
      - Touch-friendly on tablets
  satisfaction_criteria:
    - criterion: cross_pane_paths_disabled_when_basename_missing_from_listings — cross-pane copy action disabled when no pane listing contains the basename
    - criterion: Double-click opens/enters file/directory
    - criterion: Drag-and-drop moves/copies files between panes
    - criterion: file_column_menu_exclusive_with_row_operations_menu — column right-click does not open row file operations menu
    - criterion: file_column_right_click_shows_clipboard_menu — Copy filename, Copy path, Copy paths in all panes on metadata column cells
    - criterion: Left-click selects file and moves cursor
    - criterion: Right-click shows context menu with operations
    - criterion: Scroll wheel navigates file list
    - criterion: Touch gestures work on tablets
  validation_criteria:
    - method: Unit tests
      coverage: file-column-clipboard.ts formatters and cross-pane resolution
    - method: Component tests
      coverage: FileColumnContextMenu copy actions and disabled cross-pane state
    - method: Composition tests
      coverage: FilePane column right-click wiring; WorkspaceView paneFilesList binding
    - method: Integration tests
      coverage: Mouse event handling
    - method: UI tests
      coverage: Context menu display and actions
  traceability:
    architecture:
      - ARCH-MOUSE_SUPPORT
    implementation:
      - IMPL-FILE_PANE
      - IMPL-MOUSE_SUPPORT
      - IMPL-WORKSPACE_VIEW
    tests:
      - src/app/files/components/FileColumnContextMenu.test.tsx
      - src/app/files/components/FilePane.test.tsx
      - src/app/files/WorkspaceView.file-column-clipboard.test.tsx
      - src/lib/file-column-clipboard.test.ts
    code_annotations:
      - REQ-MOUSE_INTERACTION
  related_requirements:
    depends_on:
      - REQ-FILE_OPERATIONS
    related_to:
      - REQ-KEYBOARD_NAVIGATION
    supersedes: []
