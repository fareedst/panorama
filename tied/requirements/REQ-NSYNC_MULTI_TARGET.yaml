REQ-NSYNC_MULTI_TARGET:
  category: Functional
  description: 'Enable efficient copying/moving of files from the focused pane (sources) to all other visible panes (destinations) in parallel. Canonical terms: tied/vocab/nsync-multi-target.md; pseudo-code blocks IMPL-NSYNC_ENGINE_* in tied/implementation-decisions/IMPL-NSYNC_ENGINE-pseudocode.md.'
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-06-01T00:00:00.000Z'
      reason: LEAP — preserve relative path on multi-target sync (sourceBase)
    last_validated:
      date: {}
      result: implemented
      validator: AI Agent
  name: Multi-Destination File Synchronization
  priority: P1
  rationale:
    benefits:
      - CopyAll/MoveAll keyboard shortcuts for productivity
      - Parallel sync to multiple destinations for speed
      - Progress tracking and error reporting per destination
      - Safe move semantics (delete source only after ALL succeed)
    problems_solved:
      - Difficult to verify that all destinations received files correctly
      - No built-in way to sync files to all visible panes
      - Sequential copy to multiple destinations is slow and inefficient
    why: Enable efficient copying/moving of files from source to multiple destinations in parallel, inspired by Goful's nsync usage
  related_requirements:
    depends_on: []
    related_to:
      - REQ-BULK_FILE_OPS
      - REQ-MOVE_SEMANTICS
      - REQ-README_DEMO_AUTOMATION
    supersedes: []
  satisfaction_criteria:
    - criterion: Cancellation support via AbortSignal
    - criterion: 'Move semantics: delete source only after all destinations succeed (see MoveSemantics / IMPL-NSYNC_ENGINE_MoveSemantics)'
    - criterion: Observer pattern for progress callbacks (SyncObserver)
    - criterion: preserve_relative_path — sync-all maps each source to same relative path under each destination base when sourceBase provided
    - criterion: Sync files to 2+ destinations in parallel via sync-all / SyncEngine
    - criterion: Terminology and block names align with tied/vocab/nsync-multi-target.md
  status: Implemented
  traceability:
    architecture:
      - ARCH-DEMO_ASSET_PIPELINE
      - ARCH-NSYNC_INTEGRATION
    code_annotations:
      - REQ-NSYNC_MULTI_TARGET
    implementation:
      - IMPL-DEMO_SCREENSHOT_PIPELINE
      - IMPL-NSYNC_ENGINE
      - IMPL-NSYNC_OPERATIONS
    tests:
      - e2e/copyall-demo.spec.ts
  validation_criteria:
    - coverage: CopyAll/MoveAll from React UI
      method: Integration tests
    - coverage: e2e/copyall-demo.spec.ts documents CopyAll workflow and produces demo PNGs plus GIF via IMPL-DEMO_SCREENSHOT_PIPELINE
      method: Playwright
    - coverage: Multi-destination sync, move semantics, observer callbacks
      method: Unit tests
    - coverage: nested source paths with sourceBase in engine.test.ts
      method: Unit tests
