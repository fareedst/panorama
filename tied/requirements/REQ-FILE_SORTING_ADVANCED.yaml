REQ-FILE_SORTING_ADVANCED:
  category: Functional
  description: |-
    The file manager must support advanced multi-criteria sorting to enable efficient file organization and navigation. Users need to sort files by different attributes (name, size, modification time, extension) with control over sort direction and directory prioritization.

    Different file management tasks require different sort orders:
    • Finding large files requires size sorting
    • Identifying recent changes needs time sorting
    • Grouping by file type uses extension sorting
    • Quick alphabetical navigation uses name sorting

    The system must provide instant sorting feedback without network latency, maintain cursor position on the same file after sorting, and persist sort settings per pane.
  metadata:
    created:
      author: AI Agent
      date: {}
    last_updated:
      author: AI Agent
      date: '2026-05-22T22:00:00.000Z'
      reason: LEAP — shared sort Share/Shared and SortDialog tests
    last_validated:
      date: {}
      result: pass
      validator: AI Agent
  name: Advanced Multi-Criteria File Sorting
  priority: P1
  rationale:
    benefits:
      - Ascending and descending order for each criterion
      - Cursor position preservation across sorts
      - Optional directory-first sorting
      - Sort by name, size, time, extension
    problems_solved:
      - Cannot prioritize directories
      - Limited to simple name sorting
      - No ascending/descending toggle
    why: Different file management tasks require different sort orders for efficiency
  related_requirements:
    depends_on:
      - REQ-FILE_LISTING
    related_to:
      - REQ-FILE_MARKING_WEB
      - REQ-WORKSPACE_MESH_BRIDGE
    supersedes: []
  satisfaction_criteria:
    - criterion: Current sort displayed in pane footer
    - criterion: Cursor remains on same file after sorting
    - criterion: Each criterion supports ascending/descending
    - criterion: Optional directories-first toggle
    - criterion: Share and Shared disabled when focused pane sort equals shared sort
    - criterion: Sort by extension (alphabetical)
    - criterion: Sort by modification time (chronological)
    - criterion: Sort by name (alphabetical)
    - criterion: Sort by size (bytes)
    - criterion: Sort menu accessible via S key
    - criterion: Sort menu Share saves focused pane sort as workspace shared sort
    - criterion: Sort menu Shared applies workspace shared sort to focused pane only
  status: Implemented
  traceability:
    architecture:
      - ARCH-SORT_PIPELINE
    code_annotations:
      - REQ-FILE_SORTING_ADVANCED
    implementation:
      - IMPL-SORT_FILTER
    tests: []
  validation_criteria:
    - coverage: Cursor preservation after sort
      method: Integration tests
    - coverage: All sort criteria and directions
      method: Unit tests
    - coverage: Directory prioritization behavior
      method: Unit tests
    - coverage: SortDialog Share/Shared disable and callback behavior
      method: Unit tests
