REQ-NAVIGATION_LINKS:
  name: Secure New-Tab Navigation Links
  category: Functional
  priority: P1
  status: Implemented
  description: Navigation that opens in a new tab uses a shared NewTabLink component with target=_blank, rel=noopener noreferrer, and screen-reader disclosure. Applies to external URLs and internal cross-surface routes (e.g. Mesh detail to File Manager). Site config navigation.security documents default target and rel. Root home no longer renders inline marketing links.
  rationale:
    why: New-tab links must preserve workspace state and prevent tab-nabbing while remaining accessible
    problems_solved:
      - Inconsistent or missing rel/target on anchors
      - Home-page-only link model removed by sole-purpose redirect
    benefits:
      - Config-defined security defaults in site.yaml
      - Reusable NewTabLink for mesh and file manager surfaces
      - Testable DOM attributes and aria-label disclosure
  satisfaction_criteria:
    - criterion: Cross-surface Mesh and File Manager navigation uses NewTabLink (e.g. mesh restore link, workspace mesh header)
    - criterion: NewTabLink adds screen-reader disclosure (opens in new tab) via sr-only span and aria-label when applicable
    - criterion: NewTabLink renders with target=_blank and rel=noopener noreferrer
    - criterion: Site config navigation.security defines target _blank and rel noopener noreferrer (verified in config.test.ts)
  validation_criteria:
    - method: Component unit tests
      coverage: NewTabLink.test.tsx asserts target, rel, and aria-label behavior
    - method: Config unit tests
      coverage: config.test.ts asserts navigation.security defaults
    - method: Security validation
      coverage: Rendered links include noopener noreferrer in DOM
  traceability:
    architecture:
      - ARCH-APP_ROUTER
    implementation:
      - IMPL-EXTERNAL_LINKS
    tests:
      - src/components/NewTabLink.test.tsx
      - src/lib/config.test.ts
    code_annotations:
      - REQ-NAVIGATION_LINKS
  related_requirements:
    depends_on: []
    related_to:
      - REQ-CONFIG_DRIVEN_UI
      - REQ-HOME_PAGE
      - REQ-WORKSPACE_MESH_BRIDGE
    supersedes: []
  metadata:
    created:
      date: 2025-11-08T00:00:00.000Z
      author: AI Agent
    last_updated:
      date: "2026-05-30T00:00:00.000Z"
      author: AI Agent
      reason: LEAP — NewTabLink + config security; retired home-page Templates/Learning links criteria
    last_validated:
      date: "2026-05-30T00:00:00.000Z"
      validator: AI Agent
      result: pass
