  satisfaction_criteria:
    - criterion: Layout can be changed dynamically
    - criterion: Pane bounds reflect available workspace area (toolbar and header aware), not fixed viewport heuristics
    - criterion: Pane order dialog (pane.order) allows arbitrary reorder of panes[]
    - criterion: Pane URL deep link query params pane0..paneN initialize pane paths on mount for E2E and bookmarkable workspaces (see Pane URL deep link in tied/vocab/workspace-pane.md)
    - criterion: set_base_new_pane_appends_at_directory — Set base directory In a new pane appends a pane at the chosen directory when allowPaneManagement and under maxPanes via appendPaneAtPath (Append pane at path in tied/vocab/workspace-pane.md)
    - criterion: single_pane_workspace_url_bootstrap — when searchParams.panes equals 1 and pane0 present without meshId, server bootstraps exactly one pane at pane0 path instead of defaultPaneCount (Single-pane workspace URL in tied/vocab/workspace-pane.md)
    - criterion: Support 2-4 panes in any layout
    - criterion: Support OneColumn layout (all panes vertical)
    - criterion: Support OneRow layout (all panes horizontal)
    - criterion: Support Tile layout (first pane left half, others stacked right)
    - criterion: Terminology aligns with tied/vocab/workspace-pane.md
    - criterion: Three or more panes support neighbor swap (pane.swap / pane.swapPrev) and full-array cycle (pane.cycle / pane.cyclePrev)
    - criterion: Two panes can be swapped via pane.swap (keyboard and toolbar)
    - criterion: User selects layout via workspace toolbar view.layout pop-over (not header select)
