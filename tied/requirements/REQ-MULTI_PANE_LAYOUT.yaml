REQ-MULTI_PANE_LAYOUT:
  name: Multiple Pane Layout Algorithms
  category: Functional
  priority: P0
  status: Implemented
  description: 'Different layout types optimize screen space for various file management tasks. Canonical terms: tied/vocab/workspace-pane.md; pseudo-code blocks Tile, OneRow, OneColumn, Fullscreen, WORKSPACE_AREA_MEASUREMENT in IMPL-LAYOUT_CALCULATOR-pseudocode.md; AddPane, SwapPanes, CyclePanes in IMPL-PANE_MANAGEMENT-pseudocode.md.'
  rationale:
    why: Different layout types optimize screen space for various file management tasks
    problems_solved:
      - Fixed single-pane view limiting comparison
      - Inefficient screen space usage
      - Lack of flexible viewing options
    benefits:
      - Flexible screen space utilization
      - Improved file comparison workflows
      - Optimized layouts for different tasks
  satisfaction_criteria:
    - criterion: Layout can be changed dynamically
    - criterion: Pane bounds reflect available workspace area (toolbar and header aware), not fixed viewport heuristics
    - criterion: Pane order dialog (pane.order) allows arbitrary reorder of panes[]
    - criterion: Pane URL deep link query params pane0..paneN initialize pane paths on mount for E2E and bookmarkable workspaces (see Pane URL deep link in tied/vocab/workspace-pane.md)
    - criterion: Support 2-4 panes in any layout
    - criterion: Support OneColumn layout (all panes vertical)
    - criterion: Support OneRow layout (all panes horizontal)
    - criterion: Support Tile layout (first pane left half, others stacked right)
    - criterion: Terminology aligns with tied/vocab/workspace-pane.md
    - criterion: Three or more panes support neighbor swap (pane.swap / pane.swapPrev) and full-array cycle (pane.cycle / pane.cyclePrev)
    - criterion: Two panes can be swapped via pane.swap (keyboard and toolbar)
    - criterion: User selects layout via workspace toolbar view.layout pop-over (not header select)
  validation_criteria:
    - method: Visual testing
      coverage: Each layout type renders correctly with 2, 3, 4 panes
    - method: Geometric testing
      coverage: Pane bounds calculated correctly, no overlaps (62 tests)
    - method: Integration tests
      coverage: useElementSize and WorkspaceView toolbar compact toggle update pane geometry from measured workspace-area
    - method: Playwright
      coverage: e2e/readme-screenshots.spec.ts loads three panes via pane URL deep link
  traceability:
    architecture:
      - ARCH-LAYOUT_ALGORITHMS
      - ARCH-PANE_LIFECYCLE
    implementation:
      - IMPL-LAYOUT_CALCULATOR
      - IMPL-PANE_MANAGEMENT
      - IMPL-WORKSPACE_VIEW
    tests:
      - e2e/readme-screenshots.spec.ts
      - src/app/files/WorkspaceView.pane-reorder.test.tsx
      - src/lib/pane-order.test.ts
    code_annotations:
      - REQ-MULTI_PANE_LAYOUT
  related_requirements:
