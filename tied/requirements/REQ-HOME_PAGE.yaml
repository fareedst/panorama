    - criterion: Primary application UI remains at /files per REQ-FILE_MANAGER_PAGE
    - criterion: Root page does not render welcome content, logos, or external marketing links
    - criterion: Visiting / redirects to /files using next/navigation redirect
  validation_criteria:
