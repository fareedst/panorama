REQ-HOME_PAGE:
  name: Root Entry Redirect
  category: Functional
  priority: P0
  status: Implemented
  description: The application root URL (/) immediately routes users to the file manager at /files. Panorama is a file-manager-only product with no marketing or template home page at the root.
  rationale:
    why: Users should land directly in the primary workspace without an intermediate welcome page
    problems_solved:
      - Legacy Create Next App home page obscured product purpose
      - Unclear entry point before sole-purpose refactor
