      coverage: page.tsx exports Home and invokes redirect(/files)
    - method: Integration test
      coverage: app.test.tsx documents root redirect to file manager
    - method: E2E browser navigation
      coverage: e2e/root-redirect.spec.ts asserts / resolves to /files URL (redirect() not unit-testable)
