    - method: Vitest
      coverage: src/app/api/mesh/[meshId]/workspace/workspace.route.test.ts
    - method: Vitest
      coverage: src/app/files/components/WorkspaceDiffDialog.test.tsx
    - method: Vitest
      coverage: src/app/mesh/components/MeshDetailClient.test.tsx
    - method: Vitest
      coverage: src/components/NewTabLink.test.tsx
    - method: Playwright
      coverage: e2e/workspace-mesh-bridge.spec.ts
  traceability:
