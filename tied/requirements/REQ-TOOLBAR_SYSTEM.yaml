REQ-TOOLBAR_SYSTEM:
  name: File Manager Toolbar System
  category: Functional
  priority: P1
  status: Implemented
  description: 'To improve discoverability and accessibility of file manager operations by providing a visual, mouse-accessible interface alongside keyboard shortcuts. Canonical terms: tied/vocab/toolbar-keybind.md; pseudo-code blocks CYCLE_TRI_STATE, ICON_REGISTRY, TOOLBAR_COMPACT_TOGGLE in IMPL-TOOLBAR_COMPONENT-pseudocode.md.'
  rationale:
    why: To improve discoverability and accessibility of file manager operations by providing a visual, mouse-accessible interface alongside keyboard shortcuts
    problems_solved:
      - 'Context confusion: users cannot see which operations are available'
      - 'Limited accessibility: keyboard-only interface excludes mouse users'
      - 'Poor discoverability: no visual indication of available operations'
      - 'Steep learning curve: new users must memorize 36+ keyboard shortcuts'
    benefits:
      - 'Accessibility compliance: mouse and keyboard support'
      - 'Configuration flexibility: customizable via YAML'
      - 'Context awareness: active/disabled states reflect workspace'
      - 'Discoverability: buttons show names, icons, and shortcuts'
      - 'Improved onboarding: visual operation exploration'
  satisfaction_criteria:
    - criterion: All 36+ keybinding actions represented in configurable toolbars
    - criterion: Button states (active/disabled) reflect current workspace state
    - criterion: Buttons sized to prevent overflow even with 12+ actions per toolbar
    - criterion: Compact/expanded toolbar toggle does not clip panes; pane geometry updates when workspace area size changes
    - criterion: Compare filter tri-state toolbar actions (view.compareFilter.*) render via TriStateToolbarButton with data-tri-state attribute
    - criterion: Each button displays icon (when available) + keyboard shortcut in compact format; label text only shown as fallback when no icon exists
    - criterion: Each toolbar action with an icon mapping renders a registered icon from the icon registry (not the icon-unknown fallback)
    - criterion: Session starts in compact single-row icon-only toolbar; user can toggle to expanded three-tier layout with keystroke badges; tooltips retain keyboard shortcuts in both modes
    - criterion: Terminology aligns with tied/vocab/toolbar-keybind.md
    - criterion: Toolbar actions expose data-testid toolbar-{action} for Playwright demo and E2E automation (toolbar test id in tied/vocab/toolbar-keybind.md)
    - criterion: Toolbar button actions dispatch to same handlers as keyboard shortcuts
    - criterion: Toolbar group actions listed under toolbars.actions render without a keybinding row
    - criterion: Toolbar rendering does not impact file manager responsiveness
    - criterion: Toolbar styling follows existing theme system in config/theme.yaml
    - criterion: Toolbar visibility, position, and button selection configurable via config/files.yaml
    - criterion: Toolbars adapt to mobile, tablet, and desktop viewports
    - criterion: Workspace Layout toolbar group includes view.layout with Ctrl+Shift+L keybind opening layout picker pop-over
    - criterion: Workspace Panes toolbar group includes pane.swap and pane.cycle with icons; toolbar-only pane.order opens PaneOrderDialog via toolbars.actions metadata
  validation_criteria:
    - method: Component tests
      coverage: Button rendering, group layout, keystroke display, ToolbarCompactToggle aria-pressed, showKeystroke=false badge hide with tooltip shortcut retention, mergeTopToolbarConfigs tier order
    - method: Integration tests
      coverage: WorkspaceView toolbar compact/expanded branch, toggle placement on first visible top tier, merged single-row compact toolbar, action dispatch and configuration changes, pane height remeasure on compact toggle via workspace-area
    - method: Accessibility tests
      coverage: ARIA labels, keyboard navigation, focus management, toolbar-compact-toggle aria-pressed
    - method: Manual testing
      coverage: Visual inspection, compact vs expanded layout, interaction testing, responsive testing
    - method: Playwright
      coverage: e2e/readme-screenshots.spec.ts and e2e/copyall-demo.spec.ts select toolbar-view.comparison and toolbar-file.copyAll
  traceability:
    architecture:
      - ARCH-TOOLBAR_LAYOUT
      - ARCH-TOOLBAR_ACTIONS
    implementation:
      - IMPL-TOOLBAR_COMPONENT
      - IMPL-TOOLBAR_CONFIG
    tests:
      - e2e/copyall-demo.spec.ts
      - e2e/readme-screenshots.spec.ts
      - src/app/files/components/Toolbar.test.tsx
      - src/app/files/components/ToolbarButton.test.tsx
      - src/app/files/components/ToolbarCompactToggle.test.tsx
      - src/app/files/WorkspaceView.file-columns.test.tsx
      - src/app/files/WorkspaceView.pane-reorder.test.tsx
      - src/app/files/WorkspaceView.toolbar-compact.test.tsx
      - src/components/icons/registry.test.tsx
      - src/lib/toolbar.utils.test.ts
    code_annotations:
      - REQ-TOOLBAR_SYSTEM
  related_requirements:
    depends_on:
      - REQ-KEYBOARD_SHORTCUTS_COMPLETE
      - REQ-CONFIG_DRIVEN_FILE_MANAGER
    related_to:
      - REQ-MOUSE_INTERACTION
      - REQ-README_DEMO_AUTOMATION
      - REQ-TOOLBAR_CONFIG
    supersedes: []
  metadata:
    created:
      date: 2026-02-08T00:00:00.000Z
      author: AI Agent
    last_updated:
      date: "2026-05-30T00:00:00.000Z"
      author: AI Agent
      reason: LEAP — toolbar data-testid E2E dependency for demo screenshots
    last_validated:
      date: 2026-02-08T00:00:00.000Z
      validator: AI Agent
      result: planned
