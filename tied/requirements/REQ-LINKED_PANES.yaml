# REQ detail — REQ-LINKED_PANES
REQ-LINKED_PANES:
  name: Linked Pane Navigation
  category: Functional
  priority: P2
  status: Implemented
  description: The web file manager must support a toggleable "linked" navigation mode where directory navigation in the focused pane propagates to all other panes in the workspace. When enabled and the user navigates into a subdirectory, all other panes that contain a matching subdirectory also navigate to it. When the user navigates to a parent directory (backspace), all panes navigate to their respective parent directories. When linked mode is ON, cursor movements (via mouse clicks or keyboard navigation) synchronize the highlight position across all panes by filename. When linked mode is OFF, cursor movements only affect the focused pane. Sort changes also propagate to all panes when linked mode is ON.
  rationale:
    why: Users need synchronized navigation across panes for comparison tasks
    problems_solved:
      - Difficulty keeping panes synchronized
      - Manual navigation of multiple panes to same subdirectory
      - No visual indicator of linked state
    benefits:
      - Automatic synchronized directory changes
      - Configurable link groups (future enhancement)
      - Toggle linked mode on/off (L key)
      - Visual indicator in pane headers
  satisfaction_criteria:
    - criterion: Link groups configurable (future enhancement)
    - criterion: Linked mode persists across directory changes
    - criterion: Linked panes navigate to same subdirectory together
    - criterion: Toggle linked mode with L key
    - criterion: Visual indicator shows linked state in pane headers
  validation_criteria:
    - method: Unit tests
      coverage: Link state management and sync logic
    - method: Integration tests
      coverage: Synchronized navigation across panes
