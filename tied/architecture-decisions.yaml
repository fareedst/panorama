ARCH-TOOLBAR_LAYOUT:
  alternatives_considered:
    - name: Single unified toolbar
      cons:
        - 36+ buttons overwhelming
        - No scope separation
      pros:
        - Simpler implementation
      rejected_reason: Visual separation critical for usability
  cross_references:
    - REQ-TOOLBAR_CONFIG
    - REQ-TOOLBAR_SYSTEM
  detail_file: architecture-decisions/ARCH-TOOLBAR_LAYOUT.yaml
  implementation_approach:
    details:
      - 'Configurable position: top, bottom, hidden, per-pane'
      - 'Optional toolbar compact mode: session starts compact (single merged top row, icon-only); user-toggle expands to three-tier layout with keystroke badges via toolbar-compact-toggle'
      - 'Optional toolbar named mode: third session display state — three-tier layout with icon plus visible Action labels from deriveToolbarButton; keystroke badges hidden'
      - 'PaneToolbar: actions on focused pane'
      - 'SystemToolbar: independent actions'
      - 'WorkspaceToolbar: actions affecting all panes'
      - Compact/expanded/named toolbar height changes trigger workspace-area remeasure (ResizeObserver + explicit deps) so pane bounds update
      - Toolbar display toggle cycles compact → expanded → named → compact on toolbar-compact-toggle
    summary: Three toolbar types (workspace, pane, system) with configurable position and button groups
  metadata:
    created:
      author: AI Agent
      date: 2026-02-08T00:00:00.000Z
    last_updated:
