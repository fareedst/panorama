default_roots:
  - project_root
follow_symlinks: false
ignore_file: .tiedignore
token_scan:
  include_extensions:
    - .ts
    - .tsx
    - .js
    - .jsx
    - .mjs
    - .md
    - .yaml
    - .yml
    - .json
  max_file_bytes: 250000
  max_files: 8000
traceability_gap:
  dimensions:
    req_without_test: true
    req_without_implementation: true
    impl_without_test: true
  test_file:
    path_contains:
      - __tests__
      - /tests/
      - /test/
      - /spec/
    basename_suffixes:
      - .test.ts
      - .test.tsx
      - .test.js
      - .test.jsx
      - .spec.ts
      - .spec.tsx
  methodology_path_markers:
    - tied/methodology/
  non_production_path_markers:
    - templates/
    - testdata/
  exclude_methodology_only_records: true
  strict: false
