    updateDialogTitle: Save workspace
    updateModeLabel: Update current workspace
    updateSubmitLabel: Update workspace
keybindings:
  # System
  - key: '?'
    action: help.show
    category: system
    description: Show keyboard shortcuts
    modifiers:
      shift: true
  - key: p
    action: command.palette
    category: system
    description: Open command palette
    modifiers:
      ctrl: true
  - key: m
    action: mesh.saveWorkspace
    category: system
  # Navigation
    description: Save workspace as mesh
    modifiers:
      ctrl: true
      shift: true
  - key: ArrowUp
    action: navigate.up
    category: navigation
    description: Move cursor up
  - key: ArrowDown
    action: navigate.down
    category: navigation
    description: Move cursor down
  - key: Enter
    action: navigate.enter
    category: navigation
    description: Enter directory or open file
  - key: Backspace
    action: navigate.parent
    category: navigation
    description: Go to parent directory
  - key: Tab
    action: navigate.tab
    category: navigation
    description: Switch pane focus
  - key: Home
    action: navigate.first
    category: navigation
    description: Jump to first file
  - key: End
    action: navigate.last
    category: navigation
  # File Operations
    description: Jump to last file
  - key: c
    action: file.copy
    category: file-operations
    description: Copy marked files (or current file)
  - key: v
    action: file.move
    category: file-operations
  # [IMPL-NSYNC_ENGINE] [REQ-NSYNC_MULTI_TARGET] Multi-destination operations
    description: Move marked files (or current file)
  - key: C
    action: file.copyAll
    category: file-operations
    description: Copy marked files to ALL other panes
    shift: true
  - key: V
    action: file.moveAll
    category: file-operations
    description: Move marked files to ALL other panes
    shift: true
  - key: d
    action: file.delete
    category: file-operations
    description: Delete marked files (or current file)
  - key: r
    action: file.rename
    category: file-operations
  # Marking
    description: Rename file
  - key: ' '
    action: mark.toggle
    category: marking
    description: Toggle mark on current file and move down
  - key: m
    action: mark.toggle-cursor
    category: marking
    description: Toggle mark on current file (no move)
  - key: m
    action: mark.all
    category: marking
    description: Mark all files
    modifiers:
      shift: true
  - key: m
    action: mark.invert
    category: marking
    description: Invert marks
    modifiers:
      ctrl: true
  - key: Escape
    action: mark.clear
    category: marking
  # View & Sort
    description: Clear all marks
  - key: l
    action: view.layout
    category: view-sort
    description: Choose workspace layout
    modifiers:
      ctrl: true
      shift: true
  - key: s
    action: view.sort
    category: view-sort
    description: Open sort menu
  - key: '`'
    action: view.comparison
    category: view-sort
  # [REQ-LINKED_PANES] [IMPL-LINKED_NAV] Linked pane navigation
    description: Toggle comparison mode (name/size/time)
  - key: l
    action: link.toggle
    category: view-sort
    description: Toggle linked pane navigation
  - key: .
    action: view.hidden
    category: view-sort
  # Preview
    description: Toggle hidden files
  - key: i
    action: preview.info
    category: preview
    description: Show file info panel
  - key: q
    action: preview.content
    category: preview
  # Search [REQ-FILE_SEARCH]
    description: Show file preview
  - key: f
    action: search.finder
    category: system
    description: Find files (incremental search)
    modifiers:
      ctrl: true
  - key: f
    action: search.content
    category: system
  # Advanced
    description: Search file contents
    modifiers:
      ctrl: true
      shift: true
  - key: g
    action: bookmark.goto
    category: advanced
    description: Goto directory (path entry)
  - key: b
    action: bookmark.add
    category: advanced
    description: Add bookmark for current directory
  - key: b
    action: bookmark.list
    category: advanced
    description: List bookmarks
    modifiers:
      ctrl: true
  - key: "~"
    action: navigate.home
    category: advanced
    description: Go to home directory
  - key: ArrowLeft
    action: history.back
    category: advanced
    description: Navigate back in history
    modifiers:
      alt: true
  - key: ArrowRight
    action: history.forward
    category: advanced
  # [IMPL-PANE_MANAGEMENT] [ARCH-PANE_LIFECYCLE] Pane management
    description: Navigate forward in history
    modifiers:
      alt: true
  - key: =
    action: pane.add
    category: pane-management
    description: Add new pane
  - key: '-'
    action: pane.remove
    category: pane-management
    description: Remove focused pane
  - key: s
    action: pane.swap
    category: pane-management
    description: Swap panes (or swap focused with next neighbor)
    modifiers:
      ctrl: true
      shift: true
  - key: s
    action: pane.swapPrev
    category: pane-management
    description: Swap focused pane with previous neighbor
    modifiers:
      alt: true
      ctrl: true
      shift: true
  - key: ']'
    action: pane.cycle
    category: pane-management
    description: Cycle panes forward
    modifiers:
      ctrl: true
      shift: true
  - key: '['
    action: pane.cyclePrev
    category: pane-management
    description: Cycle panes backward
    modifiers:
      ctrl: true
      shift: true
  - key: r
    action: pane.refresh
    category: pane-management
    description: Refresh current pane
    modifiers:
      ctrl: true
  - key: r
    # [IMPL-PANE_REFRESH] [ARCH-PANE_REFRESH] [ARCH-KEYBIND_SYSTEM] [REQ-PANE_REFRESH] [REQ-KEYBOARD_SHORTCUTS_COMPLETE]: how: config/files.yaml registers pane.refresh (Ctrl+R) and pane.refresh-all (Ctrl+Shift+R) in pane-management category

    action: pane.refresh-all
    category: pane-management
# [REQ-FILES_CONFIG_COMPLETE] [IMPL-FILES_CONFIG_COMPLETE] Layout preferences
    description: Refresh all panes
    modifiers:
      ctrl: true
      shift: true
layout:
  # Default layout type on startup
  allowPaneManagement: true
  # Maximum number of panes (0 = no upper limit)
  default: oneColumn # tile | oneRow | oneColumn | fullscreen
  # Default number of panes (minimum 3 recommended for typical use)
  defaultLinkedMode: true
# [REQ-FILES_CONFIG_COMPLETE] [IMPL-FILES_CONFIG_COMPLETE] Startup directory configuration
  defaultPaneCount: 1
  # Allow users to add/remove panes
  maxPanes: 0
  # [REQ-LINKED_PANES] [IMPL-LINKED_NAV] Enable linked navigation mode by default
startup:
  # Startup mode: configured | last | home
  # - configured: Use paths defined below
  # - last: Remember last visited paths (requires localStorage)
  # - home: Always start at home directory
  mode: home
  # Configured startup paths per pane (when mode = "configured")
  # Supports: absolute paths, ~ for home, environment variables
  paths:
    pane1: "~"
    pane2: ~/Documents
    pane3: ~/Downloads
  # Remember last locations across sessions (requires localStorage)
  rememberLastLocations: false
# [IMPL-FILE_COLUMN_CONFIG] [IMPL-FILE_AGE_DISPLAY] Column display configuration
# Order determines display order; set visible: false to hide
# format: "age" displays relative time (e.g., "4 day 23 hr"), "absolute" shows YYYY-MM-DD HH:MM:SS
toolbars:
  # Global enable/disable
  actions:
    mesh.diffWorkspace:
      description: Diff workspace vs saved
      icon: git-compare
    pane.cycle:
      description: Cycle panes forward
      icon: refresh-cw
    pane.order:
      description: Pane order
      icon: bookmark-list
  # Workspace toolbar - actions affecting all panes
    pane.swap:
      description: Swap panes
      icon: move
    view.columns:
      description: Reorder file columns
      icon: columns
    view.compareFilter.missingSome:
      description: Name missing from some panes
      icon: file-minus
    view.compareFilter.sharedAll:
      description: Shared filename in all panes
      icon: files
    view.compareFilter.sizeGtThreshold:
      description: Larger than specified size
      icon: chevrons-up
    view.compareFilter.sizeLargestAll:
      description: Larger than all panes
      icon: maximize-2
    view.compareFilter.sizeLargestSome:
      description: Larger than some panes
      icon: trending-up
    view.compareFilter.sizeLtThreshold:
      description: Smaller than specified size
      icon: chevrons-down
    view.compareFilter.sizeSmallestAll:
      description: Smaller than all panes
      icon: minimize-2
    view.compareFilter.sizeSmallestSome:
      description: Smaller than some panes
      icon: trending-down
    view.compareFilter.thresholds:
      description: Set compare filter size/time thresholds
      icon: sliders
    view.compareFilter.timeEarliestAll:
      description: Older than all panes
      icon: history
    view.compareFilter.timeEarliestSome:
      description: Older than some panes
      icon: history
    view.compareFilter.timeGtThreshold:
      description: Newer than specified time
      icon: calendar
    view.compareFilter.timeLatestAll:
      description: Newer than all panes
      icon: clock
    view.compareFilter.timeLatestSome:
      description: Newer than some panes
      icon: clock
    view.compareFilter.timeLtThreshold:
      description: Older than specified time
      icon: calendar
    view.displaySpec:
      description: Manage display filter specs
      icon: filter
  enabled: true
  # [REQ-TOOLBAR_SYSTEM] Toolbar-only actions (no keybinding row required)
  pane:
    enabled: true
    groups:
      - name: File Operations
        actions:
          - file.copy
          - file.copyAll
          - file.delete
          - file.move
          - file.moveAll
          - file.rename
      - name: Navigation
        actions:
          - history.back
          - history.forward
          - navigate.home
          - navigate.parent
      - name: Marking
        actions:
          - mark.all
          - mark.clear
          - mark.invert
          - mark.toggle
  # System toolbar - independent actions
    position: top # top | bottom | hidden | per-pane
  system:
    enabled: true
    groups:
      - name: System
        actions:
          - command.palette
          - help.show
          - search.content
          - search.finder
    position: top
  workspace:
    enabled: true
    groups:
      - name: Layout
        actions:
          - link.toggle
          - view.columns
          - view.comparison
          - view.displaySpec
          - view.layout
          - view.sort
      - name: Compare filters
        actions:
          - view.compareFilter.missingSome
          - view.compareFilter.sharedAll
          - view.compareFilter.sizeGtThreshold
          - view.compareFilter.sizeLargestAll
          - view.compareFilter.sizeLargestSome
          - view.compareFilter.sizeLtThreshold
          - view.compareFilter.sizeSmallestAll
          - view.compareFilter.sizeSmallestSome
          - view.compareFilter.thresholds
          - view.compareFilter.timeEarliestAll
          - view.compareFilter.timeEarliestSome
          - view.compareFilter.timeGtThreshold
          - view.compareFilter.timeLatestAll
          - view.compareFilter.timeLatestSome
          - view.compareFilter.timeLtThreshold
      - name: Pane Management
        actions:
          - pane.add
          - pane.cycle
          - pane.order
          - pane.refresh-all
          - pane.remove
          - pane.swap
      - name: Mesh
        actions:
          - mesh.diffWorkspace
          - mesh.saveWorkspace
  # Pane toolbar - actions on focused pane
    position: top # top | bottom | hidden
