colors:
  dark:
    background: '#0a0a0a'
    foreground: '#ededed'
  light:
    background: '#ffffff'
    foreground: '#171717'
files:
  compareColors:
    different: bg-red-100 dark:bg-red-900
    same: bg-zinc-100 dark:bg-zinc-800
    sizeEqual: bg-green-50 dark:bg-green-950 border-l-2 border-green-500
    sizeLargest: bg-red-50 dark:bg-red-950 border-l-2 border-red-500
    sizeSmallest: bg-blue-50 dark:bg-blue-950 border-l-2 border-blue-500
    timeEarliest: bg-blue-50 dark:bg-blue-950 border-l-2 border-blue-500
    timeEqual: bg-green-50 dark:bg-green-950 border-l-2 border-green-500
    timeLatest: bg-red-50 dark:bg-red-950 border-l-2 border-red-500
    unique: bg-yellow-100 dark:bg-yellow-900
  fileTypes:
    archive:
      icon: 📦
      iconClass: text-orange-500 dark:text-orange-400
      patterns:
        - '*.7z'
        - '*.bz2'
        - '*.gz'
        - '*.rar'
        - '*.tar'
        - '*.tgz'
        - '*.xz'
        - '*.zip'
    audio:
      icon: 🎵
      iconClass: text-pink-500 dark:text-pink-400
      patterns:
        - '*.flac'
        - '*.m4a'
        - '*.mp3'
        - '*.ogg'
        - '*.wav'
    code:
      icon: 💻
      iconClass: text-purple-500 dark:text-purple-400
      patterns:
        - '*.bash'
        - '*.bat'
        - '*.c'
        - '*.cmd'
        - '*.cpp'
        - '*.css'
        - '*.dart'
        - '*.go'
        - '*.h'
        - '*.htm'
        - '*.html'
        - '*.java'
        - '*.js'
        - '*.jsx'
        - '*.kt'
        - '*.less'
        - '*.lua'
        - '*.php'
        - '*.ps1'
        - '*.py'
        - '*.rb'
        - '*.rs'
        - '*.sass'
        - '*.scss'
        - '*.sh'
        - '*.sql'
        - '*.svelte'
        - '*.swift'
        - '*.ts'
        - '*.tsx'
        - '*.vue'
        - '*.zsh'
    config:
      icon: ⚙️
      iconClass: text-gray-600 dark:text-gray-300
      patterns:
        - '*.conf'
        - '*.env'
        - '*.ini'
        - '*.json'
        - '*.toml'
        - '*.yaml'
        - '*.yml'
        - .env
        - .env.*
        - docker-compose.yaml
        - docker-compose.yml
        - Dockerfile
        - GNUmakefile
        - Makefile
    directory:
      icon: 📁
      iconClass: text-blue-500 dark:text-blue-400
    document:
      icon: 📝
      iconClass: text-blue-600 dark:text-blue-300
      patterns:
        - '*.doc'
        - '*.docx'
        - '*.md'
        - '*.pdf'
        - '*.rtf'
        - '*.txt'
    file:
      icon: 📄
      iconClass: text-gray-500 dark:text-gray-400
    image:
      icon: 🖼️
      iconClass: text-green-500 dark:text-green-400
      patterns:
        - '*.bmp'
        - '*.gif'
        - '*.heic'
        - '*.ico'
        - '*.jpeg'
        - '*.jpg'
        - '*.png'
        - '*.svg'
        - '*.tif'
        - '*.tiff'
        - '*.webp'
    spreadsheet:
      icon: 📊
      iconClass: text-green-600 dark:text-green-300
      patterns:
        - '*.csv'
        - '*.xls'
        - '*.xlsx'
    video:
      icon: 🎬
      iconClass: text-red-500 dark:text-red-400
      patterns:
        - '*.avi'
        - '*.mkv'
        - '*.mov'
        - '*.mp4'
        - '*.webm'
  overrides:
    directoryIndicator: ''
    fileCursor: ''
    fileMarked: ''
    fileRow: ''
    footer: ''
    pageContainer: ''
    paneContainer: ''
    paneFocused: ''
    paneHeader: ''
  toolbar:
    background: bg-gray-100 dark:bg-gray-900
    border: border-b border-gray-300 dark:border-gray-700
    buttonActive: bg-blue-100 dark:bg-blue-900 text-blue-800 dark:text-blue-200
    buttonBase: px-3 py-2 text-sm rounded hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors duration-150
    buttonDisabled: opacity-50 cursor-not-allowed
    groupSeparator: border-l border-gray-300 dark:border-gray-700
fonts:
  mono:
    fallback: monospace
    variable: '--font-geist-mono'
  sans:
    fallback: Arial, Helvetica, sans-serif
    variable: '--font-geist-sans'
overrides:
  buttonGroup: ''
  contentSection: ''
  heading: ''
  inlineLink: ''
  main: ''
  outerContainer: ''
  paragraph: ''
  primaryButton: ''
  secondaryButton: ''
sizing:
  buttonDesktopWidth: 158px
  buttonHeight: '12'
  maxContentWidth: 3xl
spacing:
  buttonGap: '4'
  contentGap: '6'
  page:
    paddingX: '16'
    paddingY: '32'
